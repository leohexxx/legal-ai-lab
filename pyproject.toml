[project]
name = "legal-ai-lab"
version = "0.1.0"
description = "Legal AI Lab - AI-powered legal assistance platform"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Legal AI Lab" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
]

[project.scripts]
generate-schemas = "scripts.generate_schemas:generate"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
