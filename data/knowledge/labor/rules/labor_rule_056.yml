rule_id: labor_rule_056
title: 仲裁时效中断与中止规则
domain: labor
topic: arbitration_period
related_categories:
- arbitration_period
- litigation_period
- evidence_preservation
jurisdiction: 全国
effective_from: '2008-05-01'
effective_to: null
status: active
conditions:
- 劳动者向用人单位主张权利（催讨工资等）
- 劳动者向有关部门请求权利救济
- 用人单位同意履行义务（承诺付款等）
- 因不可抗力或其他正当理由无法在时效内申请仲裁
- 劳动者需要证明仲裁时效曾中断或中止
legal_effect: 仲裁时效因当事人一方向对方当事人主张权利、向有关部门请求权利救济或对方当事人同意履行义务而中断。从中断之日起，仲裁时效期间重新计算。因不可抗力或者其他正当理由，当事人不能在规定的仲裁时效期间申请仲裁的，仲裁时效中止。从中止时效的原因消除之日起，仲裁时效期间继续计算。劳动关系存续期间因拖欠劳动报酬发生争议的，不受仲裁时效限制，但劳动关系终止后须在一年内提出。
exceptions:
- 劳动者向劳动监察投诉可构成时效中断
- 劳动者向工会反映要求维权可构成时效中断
- 因不可抗力（自然灾害、疫情封控等）可构成时效中止
- 劳动者因患严重疾病无法行使权利的，可构成时效中止
facts_required:
- 劳动者向用人单位主张权利的具体方式和时间
- 是否存在有关部门请求权利救济的记录
- 用人单位是否作出过同意履行的承诺
- 是否存在不可抗力或其他正当理由
- 时效中断或中止后的剩余期间
evidence_related:
- 催讨工资的聊天记录、邮件、录音
- 向劳动监察投诉的登记记录
- 用人单位同意付款的承诺书或沟通记录
- 不可抗力证明（如医院证明、政府通知等）
- 仲裁委员会关于时效的认定
procedure_related:
- 劳动仲裁（主张时效中断或中止）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动争议调解仲裁法
  articles:
  - 第二十七条
