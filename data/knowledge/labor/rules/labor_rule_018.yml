rule_id: "labor_rule_018"
title: "一次性伤残补助金及赔偿金规则"
domain: "labor"
topic: "lump_sum_compensation"
related_categories: ["lump_sum_compensation", "disability_grade", "death_compensation"]
jurisdiction: "全国"
effective_from: "2011-01-01"
effective_to: null
status: "active"
conditions:
  - "职工被认定为工伤并经劳动能力鉴定评定伤残等级"
  - "因工死亡或伤残等级为一级至四级"
  - "五级至十级伤残的，劳动合同解除或终止"
  - "职工因工死亡"
legal_effect: "一级至四级伤残：从工伤保险基金按伤残等级支付一次性伤残补助金（27-21个月本人工资），并按月支付伤残津贴。五级至六级：一次性伤残补助金（18-16个月本人工资），保留劳动关系。七至十级：一次性伤残补助金（13-7个月本人工资），合同期满终止或解除时支付一次性医疗补助金和就业补助金。因工死亡的：一次性工亡补助金（上年度全国城镇居民人均可支配收入的20倍）、丧葬补助金、供养亲属抚恤金。"
exceptions:
  - "用人单位未依法缴纳工伤保险费的，由用人单位支付全部工伤保险待遇"
  - "伤残津贴实际金额低于当地最低工资标准的，由工伤保险基金补足差额"
  - "一次性工伤医疗补助金和就业补助金的具体标准由省、自治区、直辖市人民政府规定"
  - "一级至四级伤残职工达到退休年龄并办理退休手续后，停发伤残津贴，享受基本养老保险待遇"
facts_required:
  - "工伤认定决定书"
  - "劳动能力鉴定结论（伤残等级）"
  - "职工本人工资标准"
  - "解除或终止劳动合同的事实（五至十级）"
  - "上年度全国城镇居民人均可支配收入（计算工亡补助金）"
  - "用人单位是否缴纳工伤保险"
evidence_related:
  - "工伤认定决定书"
  - "劳动能力鉴定结论通知书"
  - "工资单（证明本人工资标准）"
  - "工伤保险缴费记录"
  - "劳动合同及解除/终止证明"
  - "死亡证明、户籍注销证明（因工死亡）"
  - "供养亲属证明（户口本、出生证明等）"
procedure_related:
  - "向工伤保险经办机构申领待遇"
  - "劳动能力鉴定"
  - "劳动仲裁（工伤保险待遇争议）"
  - "法院诉讼"
law_reference:
  law: "工伤保险条例"
  articles: ["第三十五条", "第三十六条", "第三十七条", "第三十九条"]
