rule_id: labor_rule_031
title: 经济补偿N与N+1适用规则
domain: labor
topic: severance_pay
related_categories:
- illegal_termination
- severance_pay
- layoff_procedure
- resignation_certificate
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 用人单位提出与劳动者协商一致解除劳动合同
- 劳动者患病或非因工负伤医疗期满不能从事原工作
- 劳动者不能胜任工作，经培训或调岗后仍不能胜任
- 劳动合同订立时的客观情况发生重大变化致使合同无法履行
- 用人单位依法进行经济性裁员
- 劳动合同期满，用人单位不同意续订或降低条件续订
legal_effect: 经济补偿按劳动者在本单位工作的年限，每满一年支付一个月工资（N）。六个月以上不满一年的按一年计算；不满六个月的支付半个月工资。月工资指劳动者解除或终止前12个月的月平均工资。用人单位依照医疗期满、不能胜任工作或客观情况重大变化解除合同且未提前三十日书面通知的，还应额外支付一个月工资（N+1）。月工资高于当地社平工资三倍的，按三倍封顶计算，最高不超过12年。
exceptions:
- 劳动者主动提出解除劳动合同的，用人单位无需支付经济补偿
- 劳动者有过失（严重违纪等），用人单位即时解除的无需支付补偿
- 劳动者主动拒绝续签且用人单位维持或提高条件的，无需支付补偿
- 月平均工资超过当地上年度社平工资三倍的，按三倍封顶
facts_required:
- 解除或终止劳动合同的原因和提出方
- 劳动者在本单位的工作年限
- 劳动者解除前12个月的月平均工资
- 用人单位是否提前三十日书面通知
- 当地上年度社会平均工资
evidence_related:
- 劳动合同
- 解除或终止劳动合同通知书
- 工资条（解除前12个月）
- 协商解除协议书（如有）
- 不能胜任工作的考核记录（如适用）
procedure_related:
- 劳动仲裁（主张经济补偿）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第四十条
  - 第四十六条
  - 第四十七条
