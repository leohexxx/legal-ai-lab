rule_id: "labor_rule_020"
title: "病假工资及医疗期待遇规则"
domain: "labor"
topic: "sick_personal_leave"
related_categories: ["sick_personal_leave"]
jurisdiction: "全国"
effective_from: "1995-01-01"
effective_to: null
status: "active"
conditions:
  - "劳动者患病或非因工负伤需要停止工作医疗"
  - "劳动者因患病或非因工负伤在医疗期内"
  - "劳动者依法请病假且提供了医疗证明"
legal_effect: "企业职工患病或非因工负伤，需要停止工作医疗时，根据本人实际参加工作年限和在本单位工作年限，给予三个月到二十四个月的医疗期。医疗期内，用人单位不得解除劳动合同。病假工资或疾病救济费可以低于当地最低工资标准支付，但不能低于最低工资标准的80%。"
exceptions:
  - "医疗期满后不能从事原工作也不能从事另行安排工作的，用人单位可依法解除并支付经济补偿和医疗补助费"
  - "患绝症或精神病的职工，医疗期可适当延长"
  - "试用期职工患病或非因工负伤的，同样享受医疗期待遇"
  - "劳动者利用虚假病假条休病假的，用人单位可按规章制度处理"
  - "部分地区对病假工资比例有具体的细化规定（如按工龄分档）"
facts_required:
  - "病假起止日期及持续时间"
  - "劳动者累计工作年限及在本单位工作年限"
  - "劳动者是否提供了真实有效的医疗证明"
  - "用人单位支付的病假工资数额"
  - "当地最低工资标准"
  - "劳动者是否在医疗期内"
evidence_related:
  - "医院诊断证明"
  - "病假条或病假证明"
  - "医疗费发票及病历"
  - "劳动合同"
  - "考勤记录"
  - "工资条（显示病假工资支付情况）"
  - "请假审批记录"
  - "医疗期计算表"
procedure_related:
  - "劳动监察投诉"
  - "劳动仲裁（主张病假工资或医疗期待遇）"
  - "法院诉讼"
law_reference:
  law: "企业职工患病或非因工负伤医疗期规定"
  articles: ["第三条", "第四条", "第五条"]
