rule_id: "labor_rule_005"
title: "劳动合同变更规则"
domain: "labor"
topic: "contract_change"
related_categories: ["contract_change"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "用人单位单方面变更劳动合同内容（工作岗位、工作地点、薪酬等）"
  - "用人单位与劳动者协商一致变更合同内容"
  - "劳动者患病或非因工负伤医疗期满后不能从事原工作"
  - "劳动者不能胜任工作，用人单位调整工作岗位"
legal_effect: "变更劳动合同应当经用人单位与劳动者协商一致，采用书面形式。未经协商一致的单方变更对劳动者不发生法律效力。劳动者患病或不能胜任工作时，用人单位可依法调整岗位，但不得随意降低薪酬待遇。变更后的文本双方各执一份。"
exceptions:
  - "用人单位因生产经营需要合理调整岗位且不降低待遇，部分司法实践认可"
  - "劳动者患病或非因工负伤医疗期满不能从事原工作的，用人单位可另行安排工作"
  - "劳动者不能胜任工作，用人单位可调整工作岗位并按岗定薪"
  - "客观情况发生重大变化致使原合同无法履行，用人单位可协商变更"
facts_required:
  - "原劳动合同约定的岗位、地点、薪酬内容"
  - "变更是否经双方协商一致"
  - "变更是否为书面形式"
  - "变更后待遇是否降低"
  - "变更理由是否合法（如不能胜任工作需有考核依据）"
evidence_related:
  - "原劳动合同"
  - "劳动合同变更协议（如有）"
  - "岗位调动通知书"
  - "考核结果证明（不能胜任工作时）"
  - "沟通协商记录（邮件、会议纪要、微信记录等）"
  - "薪资变更前后的工资单"
procedure_related:
  - "劳动仲裁（确认变更效力或主张恢复原状）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第三十五条", "第四十条"]
