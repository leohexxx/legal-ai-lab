rule_id: "labor_rule_006"
title: "违法解除或终止劳动合同赔偿金规则"
domain: "labor"
topic: "illegal_termination"
related_categories: ["illegal_termination"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "用人单位违反劳动合同法规定解除劳动合同"
  - "用人单位违反劳动合同法规定终止劳动合同"
  - "用人单位解除或终止劳动合同不符合法定情形或法定程序"
legal_effect: "用人单位违法解除或终止劳动合同的，应当依照经济补偿标准的二倍向劳动者支付赔偿金。赔偿金计算年限自用工之日起计算。劳动者可以要求继续履行劳动合同，用人单位应当继续履行；劳动者不要求继续履行或合同已无法继续履行的，用人单位支付赔偿金。"
exceptions:
  - "劳动者主动辞职或协商一致解除的不构成违法解除"
  - "用人单位因法定过错解除（劳动合同法第三十九条）且程序合法的，不构成违法解除"
  - "劳动合同已实际无法继续履行的，不支持恢复劳动关系"
  - "劳动者要求继续履行的，不能同时主张赔偿金"
facts_required:
  - "用人单位解除或终止劳动合同的具体理由和依据"
  - "解除或终止是否具备法定情形"
  - "解除程序是否符合法律规定（通知工会、送达等）"
  - "劳动者是否存在法定保护情形（孕期、医疗期等）"
  - "劳动者工作年限及解除前12个月平均工资"
evidence_related:
  - "解除或终止劳动合同通知书"
  - "劳动合同"
  - "工资单及银行流水"
  - "考勤记录"
  - "工会意见征询及回复"
  - "劳动者存在法定保护情形的证明（怀孕证明、病历等）"
  - "规章制度及公示记录"
procedure_related:
  - "劳动仲裁（主张违法解除赔偿金或继续履行）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第四十七条", "第四十八条", "第八十七条"]
