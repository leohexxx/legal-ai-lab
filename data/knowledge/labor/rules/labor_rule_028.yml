rule_id: labor_rule_028
title: 劳务派遣三性岗位规则
domain: labor
topic: dispatch
related_categories:
- de_facto_relation
- dual_relation
- dispatch
- part_time
- labor_outstaffing
jurisdiction: 全国
effective_from: '2014-03-01'
effective_to: null
status: active
conditions:
- 用工单位在被派遣劳动者从事非临时性、辅助性、替代性岗位
- 劳务派遣单位与用工单位之间的派遣协议不合法
- 用工单位在非三性岗位长期使用劳务派遣工
- 劳务派遣用工比例超过用工总量的10%
legal_effect: 劳务派遣一般仅适用于临时性（存续时间不超过6个月）、辅助性（为主营业务提供辅助服务的非主营业务岗位）、替代性（正式员工因脱产学习休假等原因无法工作时的替代）岗位。用工单位应当严格控制劳务派遣用工数量，被派遣劳动者数量不得超过其用工总量的10%。违反三性岗位规定的，劳动行政部门责令限期改正；逾期不改正的，视为用工单位与被派遣劳动者直接建立劳动关系。
exceptions:
- 外国企业常驻代表机构和外国金融机构驻华代表机构等使用派遣员工的除外
- 用人单位将本单位劳动者派往境外工作或者派往家庭自然人处提供劳动的，不适用劳务派遣
- 2014年3月1日前已使用派遣员工的，给予两年过渡期调整
facts_required:
- 被派遣劳动者实际从事的工作岗位性质
- 该岗位是否属于临时性/辅助性/替代性
- 用工单位的劳务派遣用工比例
- 派遣协议内容
evidence_related:
- 劳务派遣协议
- 劳动合同（与实际用工单位的）
- 岗位说明书
- 用工单位实际用工情况说明
procedure_related:
- 劳动监察投诉
- 劳动仲裁（确认劳动关系归属）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第五十七条
  - 第六十六条
  - 第六十七条
