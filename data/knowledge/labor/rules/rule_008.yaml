# 规则卡 - 拒不支付劳动报酬罪
# 来源：最高人民法院关于审理拒不支付劳动报酬刑事案件适用法律若干问题的解释
# 关联主题：wage_arrears

rule_id: "labor_rule_008"
title: "拒不支付劳动报酬罪的认定规则"
domain: "labor"
topic: "wage_arrears"
jurisdiction: "全国"
effective_from: "2013-01-23"
effective_to: null
status: "active"
conditions:
  - "行为人以转移财产、逃匿等方法逃避支付劳动者劳动报酬"
  - "有能力支付而拒不支付劳动者劳动报酬"
  - "数额较大"
  - "经政府有关部门责令支付仍不支付"
legal_effect: "拒不支付一名劳动者三个月以上劳动报酬且数额在5000元至20000元以上，或拒不支付十名以上劳动者劳动报酬且数额累计在30000元至100000元以上的，构成拒不支付劳动报酬罪。单位犯罪对直接负责的主管人员和其他直接责任人员定罪处罚，并对单位判处罚金。"
exceptions:
  - "在刑事立案前支付劳动报酬并承担赔偿责任的，可不认为是犯罪"
  - "在提起公诉前支付并承担赔偿责任的，可减轻或免除刑事处罚"
  - "在一审宣判前支付并承担赔偿责任的，可从轻处罚"
  - "有正当理由未知悉责令支付或未及时支付的除外"
facts_required:
  - "劳动者应得劳动报酬的数额"
  - "是否存在转移财产、逃匿等行为"
  - "是否经政府有关部门责令支付"
  - "行为人是否具备支付能力"
  - "被欠薪劳动者人数及欠薪时长"
evidence_related:
  - "工资支付记录"
  - "考勤记录"
  - "限期整改指令书"
  - "行政处理决定书"
  - "银行流水"
  - "职工名册"
procedure_related:
  - "劳动监察投诉"
  - "刑事报案"
source_id: "wage_arrears_criminal_interpretation_2013"
article_ref: "第一条至第九条"
review_status: "draft"
