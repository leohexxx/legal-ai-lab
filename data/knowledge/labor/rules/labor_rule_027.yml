rule_id: labor_rule_027
title: 双重劳动关系合法性规则
domain: labor
topic: dual_relation
related_categories:
- de_facto_relation
- dual_relation
- dispatch
- part_time
- labor_outstaffing
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 劳动者与一个以上用人单位建立劳动关系
- 劳动者在非全日制用工的同时与其他单位建立劳动关系
- 劳动者在未与原单位解除合同的情况下入职新单位
- 用人单位以劳动者存在双重劳动关系为由解除劳动合同
legal_effect: 法律不禁止劳动者建立双重劳动关系。在非全日制用工情形下，劳动者可以与多个用人单位订立劳动合同。在全日制用工情形下，用人单位以劳动者同时与其他用人单位建立劳动关系对完成本单位工作造成严重影响或经提出拒不改正为由解除劳动合同的，不视为违法解除。用人单位招用与其他用人单位尚未解除或终止劳动合同的劳动者，给其他用人单位造成损失的，应当承担连带赔偿责任。
exceptions:
- 非全日制用工的劳动者可以同时与多个单位建立劳动关系
- 原用人单位同意劳动者从事第二职业的，不构成解除事由
- 劳动者在业余时间从事兼职未影响本职工作的，不构成严重违纪
facts_required:
- 劳动者与各用人单位之间是否存在管理与被管理关系
- 双重劳动关系是否影响对本单位工作的完成
- 用人单位是否知情或同意
- 原单位是否禁止从事双重劳动关系（如竞业限制约定）
evidence_related:
- 各用人单位的劳动合同
- 考勤记录
- 工资支付记录
- 社保缴费记录（是否存在多重缴纳）
- 用人单位提出异议的沟通记录
procedure_related:
- 劳动仲裁（确认双重劳动关系或解除合法性问题）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第三十九条
  - 第六十九条
  - 第九十一条
