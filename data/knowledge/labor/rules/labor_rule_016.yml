rule_id: "labor_rule_016"
title: "医疗保险待遇规则"
domain: "labor"
topic: "medical_insurance"
related_categories: ["medical_insurance"]
jurisdiction: "全国"
effective_from: "2011-07-01"
effective_to: null
status: "active"
conditions:
  - "用人单位已为劳动者缴纳基本医疗保险费"
  - "劳动者患病或非因工负伤需要就医治疗"
  - "产生的医疗费用属于医保统筹基金支付范围"
legal_effect: "参保人员发生的符合基本医疗保险药品目录、诊疗项目、医疗服务设施标准的医疗费用，按照规定从基本医疗保险基金中支付。用人单位未依法缴纳医疗保险导致劳动者无法报销医疗费用的，用人单位应承担相应医疗费用。医疗期内，用人单位应按约定或规定支付病假工资或疾病救济费。"
exceptions:
  - "应当从工伤保险基金支付的工伤医疗费用"
  - "应当由第三人负担的医疗费用（如交通事故致伤由肇事方承担）"
  - "应当由公共卫生负担的医疗费用"
  - "在境外就医的医疗费用"
  - "医保断缴后发生的医疗费用（各地有等待期规定）"
  - "基本医疗保险不予支付的自费药品和服务项目"
facts_required:
  - "用人单位是否为劳动者正常缴纳医疗保险"
  - "医疗费用是否属于医保报销范围"
  - "医疗费用实际金额"
  - "医保实际报销金额和自付金额"
  - "劳动者是否因用人单位未缴医保而无法报销"
evidence_related:
  - "社保卡及医保账户记录"
  - "医院病历、诊断证明"
  - "医疗费用发票及明细清单"
  - "医保报销分割单（已报销部分）"
  - "用人单位未缴医保的证明"
  - "劳动合同"
procedure_related:
  - "向医保经办机构申请报销"
  - "劳动仲裁（主张未缴医保导致的损失赔偿）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国社会保险法"
  articles: ["第二十三条", "第二十八条", "第三十条"]
