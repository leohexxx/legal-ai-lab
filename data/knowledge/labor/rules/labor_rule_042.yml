rule_id: labor_rule_042
title: 竞业限制协议适用对象规则
domain: labor
topic: non_compete_agreement
related_categories:
- non_compete_agreement
- non_compete_compensation
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 用人单位与普通劳动者签订竞业限制协议
- 劳动者不属于高级管理人员、高级技术人员或其他保密义务人
- 用人单位要求所有员工签署竞业限制协议
- 劳动者主张竞业限制协议对其无约束力
legal_effect: 竞业限制的人员限于用人单位的高级管理人员、高级技术人员和其他负有保密义务的人员。竞业限制的范围、地域、期限由用人单位与劳动者约定，竞业限制的约定不得违反法律、法规的规定。对不属于上述范围的一般劳动者签订的竞业限制协议，因主体不适格而无效，对劳动者无法律约束力。劳动者离职后入职竞争企业的，用人单位不得依据无效的竞业限制协议主张违约责任。
exceptions:
- 高级管理人员（公司经理、副经理、财务负责人等）适用竞业限制
- 高级技术人员（高级工程师、核心技术研发人员等）适用竞业限制
- 其他接触商业秘密的保密义务人（如销售总监、核心客户经理等）适用竞业限制
facts_required:
- 劳动者的工作岗位和职责
- 劳动者是否属于高级管理人员或高级技术人员
- 劳动者是否实际接触用人单位的商业秘密
- 竞业限制协议的签订时间和内容
evidence_related:
- 竞业限制协议
- 劳动合同（证明岗位和职责）
- 岗位说明书或职务任命文件
- 保密制度或保密协议
procedure_related:
- 劳动仲裁（确认竞业限制协议效力）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第二十三条
  - 第二十四条
