rule_id: "labor_rule_007"
title: "经济补偿金计算规则"
domain: "labor"
topic: "severance_pay"
related_categories: ["severance_pay"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "用人单位依法与劳动者协商一致解除劳动合同"
  - "劳动者因用人单位过错（未足额支付工资、未缴社保等）主动解除"
  - "用人单位无过失性辞退劳动者（医疗期满、不能胜任、客观情况重大变化）"
  - "固定期限劳动合同期满终止且用人单位不续订或降低条件"
  - "用人单位被宣告破产或提前解散导致劳动合同终止"
legal_effect: "用人单位应按照劳动者在本单位的工作年限，每满一年支付一个月工资的标准向劳动者支付经济补偿。六个月以上不满一年的按一年计算；不满六个月的向劳动者支付半个月工资的经济补偿。月工资高于当地上年度职工月平均工资三倍的，按三倍数额支付，且年限最高不超过十二年。"
exceptions:
  - "劳动者因个人过错被解除（劳动合同法第三十九条）"
  - "劳动者主动提出辞职（非因用人单位过错）"
  - "劳动合同期满劳动者不同意续订（用人单位维持或提高条件）"
  - "劳动者开始依法享受基本养老保险待遇导致合同终止"
  - "违法解除已支付赔偿金的，不再支付经济补偿"
facts_required:
  - "劳动合同解除或终止的原因及责任人"
  - "劳动者在本单位的工作起始日期（精确到月）"
  - "解除或终止前十二个月的月平均工资"
  - "当地上年度职工月平均工资"
  - "劳动者月平均工资是否超过社平三倍"
evidence_related:
  - "劳动合同"
  - "解除或终止劳动合同证明"
  - "工资条及工资支付台账"
  - "银行流水"
  - "社保缴纳记录（证明工作年限）"
  - "解除/终止通知书"
procedure_related:
  - "劳动仲裁（主张经济补偿）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第四十六条", "第四十七条"]
