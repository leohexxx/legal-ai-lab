rule_id: labor_rule_059
title: 劳动争议举证责任分配规则
domain: labor
topic: evidence_preservation
related_categories:
- arbitration_period
- litigation_period
- evidence_preservation
jurisdiction: 全国
effective_from: '2008-05-01'
effective_to: null
status: active
conditions:
- 劳动者主张存在劳动关系但用人单位否认
- 用人单位主张劳动者严重违纪并以此为由解除合同
- 劳动者主张加班费但用人单位否认加班
- 用人单位掌握的证据劳动者无法获取
- 劳动者主张用人单位拖欠工资
legal_effect: 发生劳动争议，当事人对自己提出的主张有责任提供证据。与争议事项有关的证据属于用人单位掌握管理的，用人单位应当提供；用人单位不提供的应当承担不利后果。具体而言：劳动关系认定争议中，工资支付凭证、社保记录、考勤记录等由用人单位举证；解除劳动合同争议中，用人单位应对解除理由和依据举证；加班费争议中，劳动者需提供基本加班事实证据，考勤记录等由用人单位举证；用人单位作出开除除名辞退减少劳动报酬计算劳动者工作年限等决定而引发劳动争议的，由用人单位负举证责任。
exceptions:
- 劳动者对自己的积极主张（如加班事实）仍负初步举证义务
- 劳动者要求用人单位提供证据的，需指明具体证据名称和内容
- 用人单位提供证据确有困难的，可申请延期提供
facts_required:
- 双方各自的主张内容和举证能力
- 争议证据是否由用人单位掌握管理
- 用人单位是否已提供其掌握的证据
- 劳动者是否有初步证据支持其主张
evidence_related:
- 劳动合同
- 工资支付记录
- 考勤记录
- 解除劳动合同通知书
- 违纪行为证据
- 加班申请记录
procedure_related:
- 劳动仲裁（举证责任分配）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动争议调解仲裁法
  articles:
  - 第六条
