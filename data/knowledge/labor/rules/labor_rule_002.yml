rule_id: "labor_rule_002"
title: "劳动合同续签规则"
domain: "labor"
topic: "contract_renewal"
related_categories: ["contract_renewal"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "固定期限劳动合同期满"
  - "用人单位不同意续订劳动合同"
  - "用人单位降低续订条件而劳动者不同意续订"
legal_effect: "固定期限劳动合同期满终止，用人单位不同意续订或降低条件续订导致劳动者不同意续订的，用人单位应当向劳动者支付经济补偿。连续订立二次固定期限劳动合同且劳动者没有法定解除情形的，续订时应订立无固定期限劳动合同。"
exceptions:
  - "劳动者不同意续订（用人单位维持或提高原条件）"
  - "劳动者在试用期间被证明不符合录用条件"
  - "劳动者严重违反用人单位规章制度"
  - "劳动者同时与其他用人单位建立劳动关系，对完成本单位工作造成严重影响"
facts_required:
  - "合同到期日期"
  - "用人单位是否提出续订及续订条件"
  - "劳动者是否同意续订"
  - "续订条件是维持、提高还是降低原标准"
  - "这是第几次续订固定期限合同"
evidence_related:
  - "到期劳动合同文本"
  - "续订意向沟通记录（邮件、微信、书面通知）"
  - "工资单（对比续订条件与原条件）"
  - "劳动合同终止通知书或续订通知书"
  - "劳动者不同意续订的回复"
procedure_related:
  - "劳动仲裁（主张经济补偿或要求订立无固定期限合同）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第十四条", "第四十六条", "第四十七条"]
