rule_id: "labor_rule_015"
title: "住房公积金缴存规则"
domain: "labor"
topic: "housing_fund"
related_categories: ["housing_fund"]
jurisdiction: "全国"
effective_from: "2002-03-24"
effective_to: null
status: "active"
conditions:
  - "用人单位与劳动者建立劳动关系"
  - "用人单位未为劳动者办理住房公积金缴存登记"
  - "用人单位未按时足额缴存住房公积金"
legal_effect: "用人单位应当自录用职工之日起三十日内到住房公积金管理中心办理缴存登记，并按时足额缴存住房公积金。住房公积金的月缴存额为职工本人上一年度月平均工资乘以缴存比例。单位不缴或少缴住房公积金的，由住房公积金管理中心责令限期补缴；逾期仍不补缴的，可申请法院强制执行。"
exceptions:
  - "单位与劳动者协商一致以现金形式发放公积金补贴的（仍需依法缴存，不得以补贴替代）"
  - "港澳台及外籍人员可按规定缴存，非强制性"
  - "个体工商户和自由职业者可按自愿原则缴存"
  - "用人单位确有经济困难的，经职工代表大会或工会讨论通过后可申请降低缴存比例或缓缴"
facts_required:
  - "用人单位是否办理了公积金缴存登记"
  - "缴存基数和缴存比例是否符合规定"
  - "用人单位是否按时足额缴存"
  - "劳动者是否因未缴存公积金而遭受损失（如无法使用公积金贷款）"
evidence_related:
  - "劳动合同"
  - "工资条（显示公积金代扣情况）"
  - "住房公积金个人账户查询记录"
  - "公积金管理中心出具的缴存证明或未缴存证明"
  - "用人单位降低缴存比例或缓缴的批准文件（如有）"
procedure_related:
  - "向住房公积金管理中心投诉"
  - "申请法院强制执行"
  - "劳动仲裁（仅部分支持，公积金争议一般走行政投诉途径）"
law_reference:
  law: "住房公积金管理条例"
  articles: ["第十五条", "第二十条", "第三十七条", "第三十八条"]
