rule_id: "labor_rule_011"
title: "加班费计算与支付规则"
domain: "labor"
topic: "overtime"
related_categories: ["overtime"]
jurisdiction: "全国"
effective_from: "1995-01-01"
effective_to: null
status: "active"
conditions:
  - "用人单位安排劳动者延长工作时间（工作日加班）"
  - "用人单位安排劳动者在休息日工作且不能安排补休"
  - "用人单位安排劳动者在法定休假日工作"
legal_effect: "工作日延长工作时间的，支付不低于工资的百分之一百五十的工资报酬；休息日安排工作又不能补休的，支付不低于工资的百分之二百的工资报酬；法定休假日安排工作的，支付不低于工资的百分之三百的工资报酬。每月加班时间不得超过三十六小时。"
exceptions:
  - "实行不定时工作制的岗位（如高管、外勤销售等），不适用加班费规定"
  - "实行综合计算工时工作制的，在综合计算周期内总工时未超过法定标准的，不视为加班"
  - "发生自然灾害、事故等威胁生命财产安全需要紧急处理的，不受加班时长限制"
  - "劳动者自愿加班且未经用人单位审批的，可不认定为加班"
facts_required:
  - "用人单位的工时制度（标准工时、综合计算工时、不定时工作制）"
  - "劳动者实际出勤及加班时间记录"
  - "加班是否由用人单位安排或审批"
  - "加班对应的日期类型（工作日、休息日、法定节假日）"
  - "劳动者正常工作时间工资标准"
  - "用人单位是否安排了补休（休息日加班）"
evidence_related:
  - "考勤记录（打卡记录、考勤表）"
  - "加班审批单"
  - "工资条（查看是否已支付加班费）"
  - "劳动合同（约定工时制度及工资标准）"
  - "工作沟通记录（安排加班的指令）"
  - "综合计算工时或不定时工作制的审批文件"
procedure_related:
  - "劳动仲裁（主张加班费差额）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动法"
  articles: ["第三十六条", "第四十一条", "第四十四条", "第九十条"]
