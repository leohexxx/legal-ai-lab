# 规则卡 - 最低工资保障规则
# 来源：中华人民共和国劳动法 第四十八条、最低工资规定
# 关联主题：wage_arrears

rule_id: "labor_rule_003"
title: "最低工资保障规则"
domain: "labor"
topic: "wage_arrears"
jurisdiction: "全国"
effective_from: "1995-01-01"
effective_to: null
status: "active"
conditions:
  - "存在劳动关系"
  - "劳动者在法定或约定工作时间内提供了正常劳动"
legal_effect: "用人单位支付劳动者的工资不得低于当地最低工资标准。最低工资标准由省、自治区、直辖市人民政府规定。"
exceptions:
  - "劳动者因本人原因未提供正常劳动的，不适用最低工资保障"
  - "延长工作时间工资（加班费）不计入最低工资"
  - "特殊环境津贴（中班、夜班、高温、低温、井下、有毒有害等）不计入最低工资"
  - "法律、法规和国家规定的劳动者福利待遇不计入最低工资"
facts_required:
  - "当地最低工资标准"
  - "劳动者是否提供了正常劳动"
  - "实际支付工资数额"
  - "工资构成（是否包含应剔除项目）"
evidence_related:
  - "劳动合同"
  - "工资条"
  - "当地最低工资标准文件"
procedure_related:
  - "劳动监察投诉"
  - "劳动仲裁"
  - "法院诉讼"
source_id: "labor_law_2018"
article_ref: "第四十八条"
review_status: "draft"
