rule_id: labor_rule_045
title: 竞业限制违约金规则
domain: labor
topic: non_compete_compensation
related_categories:
- non_compete_agreement
- non_compete_compensation
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 劳动者违反竞业限制约定入职竞争企业
- 劳动者违反竞业限制约定自营竞争性业务
- 竞业限制协议约定的违约金过高
- 用人单位主张劳动者承担竞业限制违约金
legal_effect: 劳动者违反竞业限制约定的，应当按照约定向用人单位支付违约金。违约金的数额应当合理，约定的违约金过分高于实际损失的，人民法院可以根据当事人的请求予以适当减少。用人单位要求劳动者继续履行竞业限制义务的，劳动者在支付违约金后仍应继续履行竞业限制义务。用人单位因劳动者违反竞业限制遭受的实际损失包括商业机会丧失、客户流失等，但由用人单位承担举证责任。
exceptions:
- 违约金过分高于实际损失的，劳动者可请求法院予以减少
- 用人单位自身违法（如超过三个月未付补偿），劳动者不构成违约
- 竞业限制协议无效的（如适用对象不符），违约金条款也无效
facts_required:
- 劳动者是否入职与原单位存在竞争关系的企业
- 竞业限制协议约定的违约金金额
- 用人单位因劳动者违约遭受的实际损失
- 用人单位是否已支付竞业限制经济补偿
- 劳动者是否已停止违约行为
evidence_related:
- 竞业限制协议
- 新单位的劳动合同或社保记录
- 新旧单位竞争关系证明
- 原单位损失证明
- 银行转账记录（经济补偿支付证明）
procedure_related:
- 劳动仲裁（主张违约金）
- 法院诉讼（确定违约金数额）
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第二十三条
  - 第九十条
