rule_id: labor_rule_050
title: 哺乳假及哺乳室规则
domain: labor
topic: nursing_period
related_categories:
- pregnancy_protection
- maternity_benefits
- nursing_period
jurisdiction: 全国
effective_from: '2012-04-28'
effective_to: null
status: active
conditions:
- 女职工在哺乳未满一周岁婴儿期间需要哺乳时间
- 用人单位未给予哺乳时间或未按规定安排
- 用人单位拒绝设置哺乳室或女职工休息室
- 用人单位因女职工哺乳降低工资或解除劳动合同
- 女职工在哺乳期内需要延长哺乳假（各地规定不同）
legal_effect: 用人单位应当在每天的劳动时间内为哺乳期女职工安排1小时哺乳时间；女职工生育多胞胎的，每多哺乳1个婴儿每天增加1小时哺乳时间。哺乳时间可以合并使用，也可分次使用。女职工比较多的用人单位应当根据女职工需要建立女职工卫生室、孕妇休息室、哺乳室等设施。哺乳时间和在本单位内哺乳往返途中的时间算作劳动时间，用人单位不得因此降低女职工的工资福利待遇或解除劳动合同。各地对哺乳假有延长规定的（如将哺乳假折算为减少工作时间），从其规定。
exceptions:
- 哺乳时间可协商集中使用（如每天推迟1小时上班或提前1小时下班）
- 女职工距家较近的可选择回家哺乳
- 用人单位已建立哺乳室的，女职工应使用哺乳室进行哺乳
facts_required:
- 女职工是否处于哺乳期（婴儿未满一周岁）
- 用人单位是否给予每天1小时哺乳时间
- 用人单位是否因此降低工资或解除合同
- 用人单位女职工数量及是否设置哺乳室等设施
- 当地是否有哺乳假延长规定
evidence_related:
- 出生医学证明（证明婴儿年龄）
- 考勤记录
- 工资条
- 劳动合同
- 用人单位关于哺乳假的规定或通知
procedure_related:
- 劳动监察投诉
- 劳动仲裁（主张哺乳时间或待遇）
- 法院诉讼
law_reference:
  law: 女职工劳动保护特别规定
  articles:
  - 第九条
  - 第十条
