rule_id: labor_rule_049
title: 生育保险待遇规则
domain: labor
topic: maternity_benefits
related_categories:
- pregnancy_protection
- maternity_benefits
- nursing_period
jurisdiction: 全国
effective_from: '2011-07-01'
effective_to: null
status: active
conditions:
- 女职工因生育发生的医疗费用需要报销
- 女职工在异地生育需要申请报销
- 用人单位未为女职工缴纳生育保险导致无法享受待遇
- 男职工的未就业配偶需要报销生育医疗费用
- 职工在非定点医疗机构生育
legal_effect: 用人单位已经缴纳生育保险费的，其职工享受生育保险待遇；职工未就业配偶按照国家规定享受生育医疗费用待遇，所需资金从生育保险基金中支付。生育保险待遇包括生育医疗费用和生育津贴。生育医疗费用包括：生育的医疗费用、计划生育的医疗费用以及法律法规规定的其他项目费用。用人单位未缴纳生育保险的，由用人单位按照生育保险待遇项目和标准支付相关费用。
exceptions:
- 男职工的未就业配偶可享受生育医疗费用报销，但不享受生育津贴
- 在境外生育的，不适用生育保险报销
- 违反计划生育政策的生育费用一般不纳入生育保险支付范围
facts_required:
- 用人单位是否依法为职工缴纳生育保险
- 生育医疗费用的具体项目和金额
- 职工是否符合计划生育政策
- 配偶是否为未就业状态（如适用）
evidence_related:
- 社保缴费记录
- 生育保险待遇申领表
- 医疗费发票
- 出院小结
- 出生医学证明
- 计划生育证明
procedure_related:
- 向社保经办机构申领生育保险待遇
- 劳动仲裁（用人单位未参保时的赔偿争议）
- 法院诉讼
law_reference:
  law: 中华人民共和国社会保险法
  articles:
  - 第五十三条
  - 第五十四条
  - 第五十五条
  - 第五十六条
