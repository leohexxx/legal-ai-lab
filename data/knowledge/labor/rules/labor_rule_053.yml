rule_id: labor_rule_053
title: 欠薪加付赔偿及刑事责任规则
domain: labor
topic: mass_arrears
related_categories:
- collective_bargaining
- mass_arrears
- strike_work_stoppage
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 劳动行政部门责令用人单位限期支付工资后逾期仍不支付
- 用人单位有能力支付而拒不支付劳动者报酬
- 欠薪数额较大且经政府有关部门责令支付仍不支付
- 用人单位以转移财产逃匿等方法逃避支付劳动者报酬
legal_effect: 用人单位克扣或无故拖欠劳动者工资的，劳动行政部门责令限期支付；逾期不支付的，责令按应付金额百分之五十以上百分之一百以下的标准向劳动者加付赔偿金。以转移财产、逃匿等方法逃避支付劳动者的劳动报酬或有能力支付而不支付，数额较大，经政府有关部门责令支付仍不支付的，构成拒不支付劳动报酬罪，处三年以下有期徒刑或者拘役，并处或单处罚金；造成严重后果的，处三年以上七年以下有期徒刑，并处罚金。
exceptions:
- 用人单位因经营困难确无支付能力的，不构成刑事犯罪
- 在提起公诉前支付劳动报酬并依法承担赔偿责任的，可减轻或免除刑事处罚
- 单位犯罪的对单位判处罚金并追究直接责任人的刑事责任
facts_required:
- 用人单位拖欠工资的事实和金额
- 劳动行政部门是否已责令限期支付
- 用人单位是否逾期仍不支付
- 用人单位是否有支付能力
- 用人单位是否有转移财产逃匿等行为
evidence_related:
- 劳动监察责令改正通知书
- 欠薪统计表
- 银行流水
- 资产转移证明（如适用）
- 用人单位经营状况证明
procedure_related:
- 劳动监察投诉
- 劳动仲裁
- 法院诉讼
- 公安机关刑事报案
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第八十五条
