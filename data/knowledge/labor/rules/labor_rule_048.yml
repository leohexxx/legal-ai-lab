rule_id: labor_rule_048
title: 产假待遇及生育津贴规则
domain: labor
topic: maternity_benefits
related_categories:
- pregnancy_protection
- maternity_benefits
- nursing_period
jurisdiction: 全国
effective_from: '2012-04-28'
effective_to: null
status: active
conditions:
- 女职工休产假期间未领取到生育津贴
- 女职工已参加生育保险但生育津贴低于本人工资
- 用人单位未为女职工缴纳生育保险
- 用人单位以产假为由拒发绩效奖金或年终奖
legal_effect: 女职工产假期间的生育津贴，对已经参加生育保险的，按照用人单位上年度职工月平均工资的标准由生育保险基金支付；对未参加生育保险的，按照女职工产假前工资的标准由用人单位支付。生育津贴低于女职工本人工资标准的，差额部分由用人单位补足。女职工生育或者流产的医疗费用，按照生育保险规定的项目和标准支付，未参加生育保险的由用人单位支付。用人单位不得因女职工生育而降低其工资或解除劳动合同。
exceptions:
- 生育津贴由社保经办机构核算发放，女职工个人可查询发放情况
- 用人单位已足额补足津贴与工资差额的，不再承担额外责任
- 女职工未提前办理生育保险待遇申领手续的，可能导致津贴延迟发放
facts_required:
- 用人单位是否为女职工缴纳了生育保险
- 生育津贴的实际发放金额和标准
- 女职工产假前的月工资标准
- 用人单位是否补足了津贴与工资的差额
- 用人单位是否因产假扣发绩效奖金
evidence_related:
- 社保缴费记录
- 生育津贴核定表
- 生育津贴银行流水
- 工资条（产假前后对比）
- 劳动合同
procedure_related:
- 向社保经办机构申领生育津贴
- 劳动仲裁（主张生育津贴差额或产假工资）
- 法院诉讼
law_reference:
  law: 女职工劳动保护特别规定
  articles:
  - 第八条
