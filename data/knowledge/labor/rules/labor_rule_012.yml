rule_id: "labor_rule_012"
title: "最低工资保障规则"
domain: "labor"
topic: "minimum_wage"
related_categories: ["minimum_wage"]
jurisdiction: "全国"
effective_from: "2004-03-01"
effective_to: null
status: "active"
conditions:
  - "劳动者在法定工作时间内提供了正常劳动"
  - "用人单位支付的劳动报酬低于当地最低工资标准"
legal_effect: "用人单位支付劳动者的工资不得低于当地最低工资标准。低于最低工资标准的，应当补足差额。劳动行政部门可责令限期支付，逾期不支付的责令加付赔偿金。最低工资标准不包括延长工作时间的工资、夜班/高温/井下/有毒有害等特殊工作环境下的津贴、以及法定福利待遇。"
exceptions:
  - "劳动者因请事假、病假等未提供正常劳动的期间"
  - "非全日制就业劳动者适用小时最低工资标准"
  - "试用期工资不得低于本单位相同岗位最低档工资的80%或合同约定工资的80%，且不得低于最低工资标准"
  - "劳动者因违纪被罚款后的实际收入可以低于最低工资标准"
  - "各地最低工资标准不同，以省、自治区、直辖市人民政府规定为准"
facts_required:
  - "当地适用的最低工资标准数额"
  - "劳动者是否在法定工作时间内提供了正常劳动"
  - "用人单位实际支付的工资数额"
  - "工资中是否包含不应计入最低工资的扣除项"
  - "劳动者适用的是月最低工资还是小时最低工资标准"
evidence_related:
  - "劳动合同"
  - "工资条（显示工资构成明细）"
  - "考勤记录"
  - "当地政府发布的最低工资标准文件"
  - "银行流水"
procedure_related:
  - "劳动监察投诉"
  - "劳动仲裁（主张补足最低工资差额）"
  - "法院诉讼"
law_reference:
  law: "最低工资规定"
  articles: ["第三条", "第十二条"]
