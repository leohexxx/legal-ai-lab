rule_id: labor_rule_037
title: 工亡赔偿标准规则
domain: labor
topic: death_compensation
related_categories:
- injury_identification
- disability_grade
- lump_sum_compensation
- death_compensation
jurisdiction: 全国
effective_from: '2011-01-01'
effective_to: null
status: active
conditions:
- 职工因工死亡
- 职工在工作时间和工作岗位突发疾病死亡或在48小时内抢救无效死亡
- 职工在抢险救灾等维护国家利益公共利益活动中受到伤害导致死亡
- 职工因战因公负伤致残后旧伤复发死亡
- 职工因工下落不明被法院宣告死亡
legal_effect: 职工因工死亡，其近亲属从工伤保险基金领取以下三项待遇：丧葬补助金为6个月的统筹地区上年度职工月平均工资；供养亲属抚恤金按职工本人工资的一定比例发给由因工死亡职工生前提供主要生活来源无劳动能力的亲属（配偶40%、其他亲属30%、孤寡老人或孤儿加10%），各供养亲属抚恤金之和不应高于生前工资；一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的20倍。用人单位未参保的，由用人单位全额承担。
exceptions:
- 一次性工亡补助金全国统一标准，不与地区挂钩
- 职工因工下落不明被宣告死亡的，近亲属可领取一次性工亡补助金
- 供养亲属的具体范围由国务院社会保险行政部门规定
facts_required:
- 工伤认定决定书（或视同工伤认定）
- 死亡证明
- 与死者的亲属关系证明
- 死者生前工资标准
- 统筹地区上年度职工月平均工资
- 上一年度全国城镇居民人均可支配收入
evidence_related:
- 工伤认定决定书
- 死亡证明
- 户口本/亲属关系证明
- 劳动合同
- 工资条
- 医院抢救记录（48小时内死亡证明）
procedure_related:
- 工伤认定申请
- 工伤保险待遇申领
- 劳动仲裁（用人单位未参保时）
- 法院诉讼
law_reference:
  law: 工伤保险条例
  articles:
  - 第十五条
  - 第三十九条
