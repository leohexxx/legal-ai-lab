rule_id: labor_rule_057
title: 劳动诉讼时效及起诉期限规则
domain: labor
topic: litigation_period
related_categories:
- arbitration_period
- litigation_period
- evidence_preservation
jurisdiction: 全国
effective_from: '2008-05-01'
effective_to: null
status: active
conditions:
- 劳动者或用人单位对仲裁裁决不服
- 收到仲裁裁决书后超过十五日未向法院起诉
- 仲裁裁决属于终局裁决的例外情形
- 劳动者对终局裁决不服向法院起诉
- 用人单位对终局裁决不服申请撤销仲裁裁决
legal_effect: 对劳动争议仲裁裁决不服的，当事人可以自收到仲裁裁决书之日起十五日内向人民法院提起诉讼；期满不起诉的，仲裁裁决发生法律效力。对终局裁决（追索劳动报酬工伤医疗费经济补偿或赔偿金不超过当地月最低工资标准十二个月金额的争议、因执行国家劳动标准发生的争议），劳动者不服可在收到裁决书之日起十五日内起诉，用人单位不服只能向中级人民法院申请撤销裁决。一方当事人在法定期限内不起诉又不履行仲裁裁决的，另一方当事人可以申请人民法院强制执行。
exceptions:
- 终局裁决仅对用人单位有严格限制，劳动者仍可在15日内起诉
- 用人单位申请撤销终局裁决须在收到裁决书之日起30日内提出
- 终局裁决被撤销后，当事人可在收到裁定书起15日内起诉
- 仲裁裁决类型（终局/非终局）由仲裁裁决书明确告知
facts_required:
- 收到仲裁裁决书的具体日期
- 裁决书是否明确为终局裁决
- 当事人是否在15日内提起诉讼
- 诉讼请求是否与仲裁请求一致
evidence_related:
- 劳动仲裁裁决书
- 仲裁裁决书送达回证
- 法院立案通知书（如已起诉）
- 强制执行申请书（仲裁生效后）
procedure_related:
- 法院诉讼（收到仲裁裁决15日内）
- 法院申请撤销仲裁裁决（用人单位对终局裁决）
- 法院强制执行（仲裁裁决生效后）
law_reference:
  law: 中华人民共和国劳动争议调解仲裁法
  articles:
  - 第五十条
  - 第四十七条
  - 第四十八条
  - 第四十九条
