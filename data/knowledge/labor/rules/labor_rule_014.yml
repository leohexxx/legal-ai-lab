rule_id: "labor_rule_014"
title: "社会保险缴纳规则"
domain: "labor"
topic: "social_insurance_payment"
related_categories: ["social_insurance_payment"]
jurisdiction: "全国"
effective_from: "2011-07-01"
effective_to: null
status: "active"
conditions:
  - "用人单位与劳动者建立劳动关系"
  - "用人单位未依法为劳动者缴纳社会保险费"
  - "用人单位未按时足额缴纳社会保险费"
legal_effect: "用人单位应当自用工之日起三十日内为劳动者向社会保险经办机构申请办理社会保险登记，并按时足额缴纳基本养老保险、基本医疗保险、工伤保险、失业保险和生育保险费用。未依法缴纳的，劳动者有权解除劳动合同并要求经济补偿。社会保险征收机构可责令限期补缴并加收滞纳金。"
exceptions:
  - "劳动者在国外就业、在中国境内就业的外国人另有规定的除外"
  - "非全日制用工的工伤保险由用人单位缴纳，其他险种可按灵活就业人员身份自行缴纳"
  - "劳务派遣关系中，由派遣单位负责为劳动者缴纳社会保险"
  - "已达到法定退休年龄并享受养老保险待遇的，不再缴纳养老保险"
  - "劳动者书面承诺放弃社保的承诺无效，缴纳社保为法定强制性义务"
facts_required:
  - "劳动关系的起始日期"
  - "用人单位是否为劳动者办理了社保登记"
  - "用人单位是否按时足额缴纳各项社保费用"
  - "劳动者是否已发生应由社保基金支付的费用"
  - "用人单位是否存在让劳动者签署放弃社保承诺的情形"
evidence_related:
  - "劳动合同"
  - "社会保险缴纳记录（社保部门出具的缴费证明）"
  - "工资条（显示社保代扣情况）"
  - "劳动者社保卡"
  - "放弃社保承诺书（如有）"
  - "社保部门出具的责令补缴通知书（如有）"
  - "工牌、考勤记录等证明劳动关系的材料"
procedure_related:
  - "向社保行政部门投诉或举报"
  - "劳动仲裁（主张解除合同及经济补偿）"
  - "法院诉讼"
  - "税务部门社保征收投诉"
law_reference:
  law: "中华人民共和国社会保险法"
  articles: ["第五十八条", "第六十条", "第八十六条"]
