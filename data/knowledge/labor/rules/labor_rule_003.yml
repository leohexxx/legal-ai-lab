rule_id: "labor_rule_003"
title: "用人单位单方解除劳动合同规则"
domain: "labor"
topic: "contract_termination_by_employer"
related_categories: ["contract_termination_by_employer"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "劳动者在试用期间被证明不符合录用条件"
  - "劳动者严重违反用人单位规章制度"
  - "劳动者严重失职、营私舞弊，给用人单位造成重大损害"
  - "劳动者同时与其他用人单位建立劳动关系，对完成本单位工作造成严重影响"
  - "劳动者以欺诈手段使用人单位在违背真实意思下订立合同"
  - "劳动者被依法追究刑事责任"
legal_effect: "用人单位可以立即解除劳动合同，无需提前三十日通知，且无需支付经济补偿。用人单位应当将解除理由通知工会。解除后应当出具解除证明并办理档案和社会保险关系转移手续。"
exceptions:
  - "处于医疗期内的患病或非因工负伤职工"
  - "处于孕期、产期、哺乳期的女职工"
  - "在本单位连续工作满十五年且距法定退休年龄不足五年的职工"
  - "从事接触职业病危害作业未进行离岗前职业健康检查的职工"
facts_required:
  - "劳动者存在过错的具体事实"
  - "用人单位规章制度是否经过民主程序制定且已向劳动者公示"
  - "用人单位是否已履行通知工会的义务"
  - "劳动者是否存在法定保护情形"
  - "解除通知书是否送达劳动者"
evidence_related:
  - "劳动合同"
  - "用人单位规章制度（经民主程序）及公示记录"
  - "违纪事实证据（考勤记录、监控录像、书面检查等）"
  - "解除劳动合同通知书及送达回执"
  - "工会意见（如有）"
  - "不符合录用条件的证明材料（试用期考核表等）"
procedure_related:
  - "劳动仲裁（确认解除是否合法）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第三十九条", "第四十三条", "第四十八条"]
