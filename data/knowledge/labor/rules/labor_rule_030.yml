rule_id: labor_rule_030
title: 违法解除劳动合同2N赔偿规则
domain: labor
topic: illegal_termination
related_categories:
- illegal_termination
- severance_pay
- layoff_procedure
- resignation_certificate
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 用人单位解除劳动合同没有法定依据或依据不成立
- 用人单位以严重违纪为由解除但劳动者行为不构成严重违纪
- 用人单位解除劳动合同未事先通知工会
- 用人单位在劳动者医疗期/孕期/产期/哺乳期违法解除
- 用人单位依照法定解除情形解除但程序违法
legal_effect: 用人单位违反劳动合同法规定解除或者终止劳动合同的，应当依照法定经济补偿标准的二倍向劳动者支付赔偿金（即2N）。经济补偿按劳动者在本单位工作的年限，每满一年支付一个月工资；六个月以上不满一年的按一年算；不满六个月的向劳动者支付半个月工资。工资基数为劳动者解除前12个月的月平均工资。支付了赔偿金的，不再支付经济补偿。
exceptions:
- 劳动者严重违反用人单位规章制度，用人单位可即时解除且无需支付赔偿
- 劳动者在试用期被证明不符合录用条件，用人单位可依法解除
- 劳动者同时与其他单位建立劳动关系严重影响本职工作，用人单位可解除
- 劳动者以欺诈手段使用人单位违背真实意思签订合同的，用人单位可解除
facts_required:
- 用人单位解除劳动合同的具体理由
- 解除理由是否符合劳动合同法的规定
- 用人单位是否履行了工会通知程序
- 劳动者在本单位的工作年限
- 劳动者解除前12个月的月平均工资
- 劳动者是否处于医疗期/孕期/产期/哺乳期等特殊保护期
evidence_related:
- 解除劳动合同通知书
- 劳动合同
- 工资条（解除前12个月）
- 工会意见（如有）
- 考勤记录
- 违纪行为证据（如以严重违纪为由解除）
- 录音录像
procedure_related:
- 劳动仲裁（主张违法解除赔偿金或恢复劳动关系）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第四十七条
  - 第四十八条
  - 第八十七条
