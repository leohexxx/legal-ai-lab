rule_id: labor_rule_026
title: 未签合同的事实劳动关系认定
domain: labor
topic: de_facto_relation
related_categories:
- de_facto_relation
- dual_relation
- dispatch
- part_time
- labor_outstaffing
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 用人单位自用工之日起超过一个月未与劳动者签订书面劳动合同
- 用人单位否认与劳动者存在劳动关系
- 劳动者主张存在事实劳动关系但无书面合同
- 用人单位与劳动者之间存在人身依附性和经济从属性
legal_effect: 用人单位自用工之日起即与劳动者建立劳动关系，无论是否签订书面合同。用人单位超过一个月不满一年未签订合同的，每月支付二倍工资。用人单位对与劳动者是否存在劳动关系负有举证责任，不能提供工资支付记录、考勤记录等证据的，应当承担不利后果。事实劳动关系同样受劳动法保护，双方权利义务参照劳动合同法的一般规定。
exceptions:
- 非全日制用工可以不订立书面劳动合同
- 个人承包经营者招用的劳动者与发包方之间一般不直接认定劳动关系
- 在校学生实习、兼职等一般按劳务关系处理
facts_required:
- 劳动者是否接受用人单位的管理和安排
- 用人单位是否向劳动者支付报酬及支付方式
- 是否存在工作证、考勤记录、社保记录等证明文件
- 用工起始时间
- 用人单位是否否认劳动关系及理由
evidence_related:
- 工资支付记录/银行流水
- 社保缴费记录
- 工作证/工牌
- 考勤记录
- 招聘登记表或入职登记表
- 证人证言
- 工作沟通记录（微信、邮件等）
procedure_related:
- 劳动仲裁（确认劳动关系）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第七条
  - 第十条
  - 第八十二条
