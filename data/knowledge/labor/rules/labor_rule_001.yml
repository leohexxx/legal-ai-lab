rule_id: "labor_rule_001"
title: "劳动合同订立与双倍工资规则"
domain: "labor"
topic: "contract_conclusion"
related_categories: ["contract_conclusion", "de_facto_relation"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同"
  - "用人单位自用工之日起满一年未与劳动者订立书面劳动合同"
legal_effect: "超过一个月不满一年未订立的，用人单位应当向劳动者每月支付二倍的工资；满一年未订立的，视为自用工之日起满一年的当日已经与劳动者订立无固定期限劳动合同。"
exceptions:
  - "非全日制用工（小时工）可以不订立书面劳动合同"
  - "因不可抗力导致无法签订合同的，相应期间不计入双倍工资计算"
  - "劳动者本人拒绝签订且用人单位已尽到诚信磋商义务的，部分地区不适用双倍工资罚则"
facts_required:
  - "用工起始日期（入职时间）"
  - "是否已签订书面劳动合同"
  - "未签订劳动合同的持续时间"
  - "用人单位是否履行了要求签订合同的通知义务"
  - "劳动者拒绝签订合同的事实"
evidence_related:
  - "劳动合同（如有）"
  - "工资支付记录/银行流水"
  - "考勤记录"
  - "要求签订合同的通知（书面、邮件、微信记录等）"
  - "入职登记表"
  - "工作沟通记录"
procedure_related:
  - "劳动仲裁（确认劳动关系、主张双倍工资）"
  - "法院诉讼"
  - "劳动监察投诉"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第十条", "第十四条", "第八十二条"]
