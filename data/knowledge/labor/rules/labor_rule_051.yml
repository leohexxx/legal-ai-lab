rule_id: labor_rule_051
title: 集体合同效力规则
domain: labor
topic: collective_bargaining
related_categories:
- collective_bargaining
- mass_arrears
- strike_work_stoppage
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 企业职工一方与用人单位通过平等协商订立集体合同
- 集体合同草案未经职工代表大会或全体职工讨论通过
- 集体合同订立后未报送劳动行政部门
- 个人劳动合同约定的劳动条件低于集体合同标准
legal_effect: 企业职工一方与用人单位通过平等协商，可以就劳动报酬、工作时间、休息休假、劳动安全卫生、保险福利等事项订立集体合同。集体合同草案应当提交职工代表大会或者全体职工讨论通过。集体合同订立后应当报送劳动行政部门，劳动行政部门自收到集体合同文本之日起十五日内未提出异议的，集体合同即行生效。依法订立的集体合同对用人单位和全体职工具有约束力。行业性、区域性集体合同对当地本行业、本区域的用人单位和职工具有约束力。个人劳动合同约定的劳动条件和报酬等标准不得低于集体合同标准。
exceptions:
- 集体合同效力高于个人劳动合同，个人合同标准不得低于集体合同
- 劳动行政部门有权对集体合同提出异议，异议期间合同不生效
- 行业性集体合同适用于该行业的所有用人单位和职工
facts_required:
- 集体合同是否经职工代表大会或全体职工讨论通过
- 集体合同是否已报送劳动行政部门
- 劳动行政部门是否提出异议
- 个人劳动合同标准是否低于集体合同标准
evidence_related:
- 集体合同文本
- 职工代表大会决议
- 劳动行政部门审查意见书
- 劳动合同
procedure_related:
- 劳动监察投诉
- 劳动仲裁（集体合同履行争议）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第五十一条
  - 第五十二条
  - 第五十三条
  - 第五十四条
