rule_id: "labor_rule_017"
title: "工伤认定规则"
domain: "labor"
topic: "injury_identification"
related_categories: ["injury_identification", "disability_grade"]
jurisdiction: "全国"
effective_from: "2011-01-01"
effective_to: null
status: "active"
conditions:
  - "在工作时间和工作场所内，因工作原因受到事故伤害"
  - "工作时间前后在工作场所内，从事与工作有关的预备性或收尾性工作受到事故伤害"
  - "在工作时间和工作场所内，因履行工作职责受到暴力等意外伤害"
  - "患职业病"
  - "因工外出期间，由于工作原因受到伤害或发生事故下落不明"
  - "在上下班途中，受到非本人主要责任的交通事故或城市轨道交通、客运轮渡、火车事故伤害"
  - "法律、行政法规规定应当认定为工伤的其他情形"
legal_effect: "职工发生事故伤害或者被诊断、鉴定为职业病的，所在单位应在三十日内向统筹地区社会保险行政部门提出工伤认定申请。用人单位未申请的，工伤职工或其近亲属可在一年内申请。经认定为工伤的，享受工伤保险待遇（医疗费、康复费、停工留薪期待遇、伤残待遇等）。"
exceptions:
  - "故意犯罪"
  - "醉酒或者吸毒"
  - "自残或者自杀"
  - "在工作时间和工作岗位突发疾病但未死亡且在48小时内未抢救无效死亡（不视为工伤，但视同工伤情形另有规定）"
facts_required:
  - "事故发生的时间、地点、原因"
  - "事故是否发生在工作时间和工作场所内"
  - "事故与工作之间的因果关系"
  - "上下班途中事故需确认本人责任比例"
  - "职业病需有法定诊断机构的诊断证明"
  - "用人单位是否在30日内申请认定"
evidence_related:
  - "事故现场照片、视频"
  - "目击证人证言及联系方式"
  - "医院的诊断证明和病历"
  - "交通事故责任认定书（上下班途中事故）"
  - "职业病诊断证明书"
  - "劳动合同或证明劳动关系的材料"
  - "考勤记录（证明事发时间在工作时间内）"
  - "工伤认定申请表"
procedure_related:
  - "向社会保险行政部门申请工伤认定"
  - "对工伤认定结果不服可申请行政复议或提起行政诉讼"
  - "劳动能力鉴定（确定伤残等级）"
  - "劳动仲裁（工伤保险待遇争议）"
law_reference:
  law: "工伤保险条例"
  articles: ["第十四条", "第十五条", "第十六条", "第十七条"]
