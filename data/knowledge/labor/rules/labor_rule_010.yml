rule_id: "labor_rule_010"
title: "工资足额及时支付规则"
domain: "labor"
topic: "salary_arrears"
related_categories: ["salary_arrears"]
jurisdiction: "全国"
effective_from: "1995-01-01"
effective_to: null
status: "active"
conditions:
  - "用人单位未按照劳动合同约定或国家规定及时足额支付劳动者工资"
  - "用人单位克扣或无故拖欠劳动者工资"
  - "用人单位支付工资低于当地最低工资标准"
legal_effect: "用人单位应当以货币形式按月足额支付工资，不得克扣或无故拖欠。拖欠工资的，劳动行政部门责令限期支付；逾期不支付的，责令按应付金额百分之五十以上百分之一百以下加付赔偿金。劳动者可以以此为由解除劳动合同并要求支付经济补偿。"
exceptions:
  - "法定代扣代缴项目（个人所得税、社会保险费个人部分）"
  - "法院判决、裁定要求代扣的抚养费、赡养费等"
  - "劳动者造成用人单位经济损失，依合同约定扣除赔偿（每月扣除不超过当月工资20%）"
  - "因不可抗力导致无法按时支付的，应及时告知劳动者"
facts_required:
  - "劳动关系是否存在"
  - "约定工资标准及实际支付金额"
  - "拖欠工资的金额和时间段"
  - "是否低于当地最低工资标准"
  - "用人单位是否提出抗辩理由（如经营困难）"
evidence_related:
  - "劳动合同（约定工资标准）"
  - "工资条"
  - "银行流水"
  - "考勤记录"
  - "欠条或欠薪承诺书"
  - "催讨工资的沟通记录（微信、邮件、录音等）"
  - "劳动监察责令改正通知书（如有）"
procedure_related:
  - "劳动监察投诉（最快捷途径）"
  - "劳动仲裁（主张欠薪及加付赔偿金）"
  - "法院诉讼"
  - "申请支付令"
law_reference:
  law: "中华人民共和国劳动法"
  articles: ["第五十条", "第九十一条"]
