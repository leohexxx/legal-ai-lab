rule_id: labor_rule_035
title: 一级至四级伤残赔偿标准规则
domain: labor
topic: disability_grade
related_categories:
- injury_identification
- disability_grade
- lump_sum_compensation
- death_compensation
jurisdiction: 全国
effective_from: '2011-01-01'
effective_to: null
status: active
conditions:
- 职工因工致残被鉴定为一级至四级伤残
- 一级至四级伤残职工需要保留劳动关系退出工作岗位
- 一级至四级伤残职工要求用人单位支付伤残津贴
- 用人单位未为伤残职工缴纳工伤保险
legal_effect: 职工因工致残被鉴定为一级至四级伤残的，保留劳动关系，退出工作岗位，享受以下待遇：从工伤保险基金按伤残等级支付一次性伤残补助金（一级27个月、二级25个月、三级23个月、四级21个月本人工资）；从工伤保险基金按月支付伤残津贴（一级90%、二级85%、三级80%、四级75%本人工资）。伤残津贴实际金额低于当地最低工资标准的，由工伤保险基金补足差额。用人单位未参加工伤保险的，上述待遇由用人单位承担。
exceptions:
- 伤残津贴由工伤保险基金支付，用人单位无需支付工资
- 一级至四级伤残职工达到退休年龄并办理退休手续后停发伤残津贴，享受基本养老保险待遇
- 基本养老保险待遇低于伤残津贴的，由工伤保险基金补足差额
facts_required:
- 劳动能力鉴定结论（伤残等级）
- 工伤认定决定书
- 受伤前12个月的本人月平均工资
- 当地最低工资标准
evidence_related:
- 工伤认定决定书
- 劳动能力鉴定结论通知书
- 劳动合同
- 工资条
- 社保缴纳记录
procedure_related:
- 劳动能力鉴定（伤残等级鉴定）
- 工伤保险待遇申领
- 劳动仲裁（用人单位未参保时）
- 法院诉讼
law_reference:
  law: 工伤保险条例
  articles:
  - 第三十五条
