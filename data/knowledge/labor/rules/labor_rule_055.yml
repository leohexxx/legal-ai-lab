rule_id: labor_rule_055
title: 劳动仲裁时效一年规则
domain: labor
topic: arbitration_period
related_categories:
- arbitration_period
- litigation_period
- evidence_preservation
jurisdiction: 全国
effective_from: '2008-05-01'
effective_to: null
status: active
conditions:
- 劳动者申请劳动仲裁的时间已超过一年
- 劳动者从知道或应当知道权利被侵害之日已超过一年
- 欠薪争议在劳动关系存续期间
- 劳动关系终止后劳动者主张欠薪
legal_effect: 劳动争议仲裁时效为一年，从当事人知道或者应当知道其权利被侵害之日起计算。超过仲裁时效申请仲裁的，劳动仲裁委员会可不予受理或驳回申请。但劳动关系存续期间因拖欠劳动报酬发生争议的，劳动者申请仲裁不受一年仲裁时效的限制；但是劳动关系终止的，应当自劳动关系终止之日起一年内提出。仲裁时效的中断和中止依照相关法律规定执行。
exceptions:
- 欠薪争议在劳动关系存续期间不受一年时效限制
- 劳动关系终止后的欠薪请求须在终止之日起一年内提出
- 仲裁时效可因主张权利、提起诉讼等事由中断
- 因不可抗力或其他正当理由超过时效的，仲裁时效可中止
facts_required:
- 劳动者知道或应当知道权利被侵害的具体日期
- 劳动关系是否已终止及终止日期
- 争议类型是否为拖欠劳动报酬
- 是否存在时效中断或中止事由
- 申请劳动仲裁的日期
evidence_related:
- 劳动仲裁申请书（证明申请日期）
- 仲裁委员会出具的受理或不予受理通知书
- 证明时效中断的催讨记录
- 劳动合同（证明劳动关系存续期间）
- 劳动关系终止证明
procedure_related:
- 劳动仲裁（注意时效审查）
- 法院诉讼（如仲裁以超时效为由不予受理）
law_reference:
  law: 中华人民共和国劳动争议调解仲裁法
  articles:
  - 第二十七条
