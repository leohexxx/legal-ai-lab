rule_id: labor_rule_054
title: 停工怠工合法性规则
domain: labor
topic: strike_work_stoppage
related_categories:
- collective_bargaining
- mass_arrears
- strike_work_stoppage
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 劳动者群体采取停工、怠工方式表达诉求
- 停工是因为用人单位存在严重违法行为（欠薪、欠缴社保等）
- 工会在停工事件中组织协调
- 用人单位因停工遭受损失并追究劳动者责任
- 政府有关部门介入处理停工事件
legal_effect: 中国现行法律未明确规定罢工权，但劳动者有权通过工会、集体协商及法律途径维护自身权益。因用人单位存在严重违法（如长期欠薪、严重危害安全生产）引发的停工，一般不认定为劳动者违约或违纪。工会应当代表职工依法维权，参与协调处理。因用人单位原因造成停工停产，用人单位应按劳动合同约定支付工资；超过一个工资支付周期的，按各地规定支付生活费。劳动者以停工方式提出诉求后应尽快通过合法途径（劳动监察、仲裁等）解决争议。
exceptions:
- 供水供电供气等公共服务业从业人员不得擅离职守影响公共服务
- 停工期间劳动者不得有暴力、破坏生产设备等违法行为
- 工会应当引导劳动者依法理性维权
- 政府有关部门可依法采取必要措施维护社会秩序
facts_required:
- 停工的具体原因（是否因用人单位严重违法）
- 停工的组织方式和规模
- 停工持续时间和影响
- 工会是否参与协调
- 政府有关部门是否介入及处理意见
evidence_related:
- 用人单位违法行为的证据（欠薪记录等）
- 工会协调记录
- 政府有关部门的处理意见
- 停工期间的考勤记录
- 工资支付记录
procedure_related:
- 劳动监察投诉
- 劳动仲裁
- 法院诉讼
- 工会协调
- 政府有关部门调解
law_reference:
  law: 中华人民共和国劳动法
  articles:
  - 第三条
  - 第八十八条
