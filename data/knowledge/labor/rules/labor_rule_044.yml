rule_id: labor_rule_044
title: 竞业限制经济补偿标准规则
domain: labor
topic: non_compete_compensation
related_categories:
- non_compete_agreement
- non_compete_compensation
jurisdiction: 全国
effective_from: '2021-01-01'
effective_to: null
status: active
conditions:
- 用人单位与劳动者约定竞业限制但未约定经济补偿
- 用人单位已约定经济补偿但金额过低
- 用人单位未按月向劳动者支付竞业限制经济补偿
- 用人单位超过三个月未支付竞业限制经济补偿
- 劳动者向用人单位主张竞业限制经济补偿
legal_effect: 用人单位对劳动者进行竞业限制的，应当在竞业限制期限内按月给予劳动者经济补偿。未约定经济补偿但劳动者履行了竞业限制义务的，劳动者可要求用人单位按月支付经济补偿，补偿标准为劳动者离职前12个月月平均工资的30%，且不低于劳动合同履行地的最低工资标准。用人单位超过三个月未支付经济补偿的，劳动者有权请求解除竞业限制约定。劳动者解除竞业限制后，可入职竞争企业。
exceptions:
- 劳动者在竞业限制期间入职不构成竞争关系的企业，不影响补偿金领取
- 用人单位可随时解除竞业限制协议，但须额外支付三个月补偿
- 劳动者违反竞业限制的，用人单位可要求退还已支付的补偿并主张违约金
facts_required:
- 竞业限制协议是否约定经济补偿及标准
- 用人单位是否按月实际支付经济补偿
- 用人单位未支付的持续时间
- 劳动者是否履行了竞业限制义务
- 劳动者离职前12个月的平均工资
- 劳动合同履行地的最低工资标准
evidence_related:
- 竞业限制协议
- 银行流水（证明补偿金支付情况）
- 离职证明
- 工资条
- 劳动者与新单位签订的劳动合同
procedure_related:
- 劳动仲裁（主张竞业限制经济补偿）
- 法院诉讼
law_reference:
  law: 最高人民法院关于审理劳动争议案件适用法律问题的解释（一）
  articles:
  - 第三十六条
  - 第三十八条
