rule_id: labor_rule_046
title: 孕期女职工不得辞退规则
domain: labor
topic: pregnancy_protection
related_categories:
- pregnancy_protection
- maternity_benefits
- nursing_period
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 女职工在孕期、产期、哺乳期内被用人单位单方解除劳动合同
- 用人单位以女职工怀孕为由辞退或变相辞退
- 用人单位以经济性裁员为由辞退孕期女职工
- 用人单位以女职工不能胜任工作为由辞退孕期女职工
- 女职工在孕期被违法解除合同后要求恢复工作
legal_effect: 用人单位不得依照劳动合同法第四十条（无过失性辞退）和第四十一条（经济性裁员）的规定解除处于孕期、产期、哺乳期的女职工的劳动合同。违法解除的，女职工有权要求继续履行劳动合同（恢复劳动关系）或要求用人单位支付违法解除赔偿金（2N）。孕期、产期、哺乳期内劳动合同期满的，劳动合同自动顺延至哺乳期结束。但女职工有严重违纪等法定过失情形的，用人单位仍可解除。
exceptions:
- 孕期女职工严重违反用人单位规章制度的，用人单位可即时解除
- 孕期女职工严重失职营私舞弊给用人单位造成重大损害的，可解除
- 孕期女职工同时与其他单位建立劳动关系严重影响本职工作的，可解除
- 孕期女职工被追究刑事责任的，用人单位可解除
facts_required:
- 女职工是否处于孕期、产期或哺乳期
- 用人单位解除劳动合同的具体理由
- 解除理由是否属于法定禁止解除情形
- 女职工是否同意解除及是否要求恢复工作
- 劳动合同是否已到期
evidence_related:
- 怀孕证明（B超单、产检记录等）
- 劳动合同
- 解除劳动合同通知书
- 录音录像（证明公司以怀孕为由辞退）
- 工作沟通记录
procedure_related:
- 劳动仲裁（主张违法解除赔偿金或恢复劳动关系）
- 法院诉讼
- 劳动监察投诉
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第四十二条
  - 第四十五条
  - 第八十七条
