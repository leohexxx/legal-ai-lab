rule_id: labor_rule_022
title: 试用期工资与解除规则
domain: labor
topic: probation_dispute
related_categories:
- contract_conclusion
- contract_renewal
- contract_termination_by_employer
- contract_expiration
- contract_change
- probation_dispute
jurisdiction: 全国
effective_from: '2008-01-01'
effective_to: null
status: active
conditions:
- 劳动者在试用期的工资低于劳动合同约定工资的百分之八十
- 劳动者在试用期的工资低于用人单位所在地最低工资标准
- 用人单位在试用期解除劳动合同但未说明理由或理由不成立
- 用人单位以不符合录用条件为由在试用期解除劳动合同
legal_effect: 试用期工资不得低于本单位相同岗位最低档工资或劳动合同约定工资的百分之八十，且不得低于用人单位所在地最低工资标准。试用期内用人单位解除劳动合同的，应当向劳动者说明理由。以不符合录用条件为由解除的，须证明劳动者确实不符合事先明确的录用条件且已告知劳动者。违法解除的，应支付2倍经济补偿标准的赔偿金。
exceptions:
- 劳动者在试用期内提前三日通知用人单位可以解除劳动合同
- 试用期被证明不符合录用条件，用人单位可解除合同，无需支付经济补偿
- 劳动者在试用期严重违反规章制度，用人单位可即时解除
facts_required:
- 劳动合同约定的试用期工资标准
- 用人单位所在地的最低工资标准
- 用人单位是否事先明确了录用条件并告知劳动者
- 用人单位解除劳动合同的理由
- 劳动者是否存在不符合录用条件的事实
evidence_related:
- 劳动合同（约定工资及试用期工资）
- 工资条
- 录用条件告知书
- 解除劳动合同通知书
- 试用期考核记录
procedure_related:
- 劳动仲裁（主张工资差额或违法解除赔偿金）
- 法院诉讼
law_reference:
  law: 中华人民共和国劳动合同法
  articles:
  - 第二十条
  - 第二十一条
  - 第三十九条
  - 第八十七条
