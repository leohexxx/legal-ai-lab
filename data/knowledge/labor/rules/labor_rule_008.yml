rule_id: "labor_rule_008"
title: "经济性裁员规则"
domain: "labor"
topic: "layoff_procedure"
related_categories: ["layoff_procedure"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "用人单位依照企业破产法规定进行重整"
  - "生产经营发生严重困难"
  - "企业转产、重大技术革新或经营方式调整，经变更合同后仍需裁减人员"
  - "其他因劳动合同订立时所依据的客观经济情况发生重大变化致使合同无法履行"
  - "需要裁减人员二十人以上或占职工总数百分之十以上"
legal_effect: "用人单位提前三十日向工会或全体职工说明情况并听取意见后，将裁减人员方案向劳动行政部门报告，方可裁减人员。被裁减人员有权获得经济补偿。用人单位在六个月内重新招用人员的，应当通知被裁减人员并在同等条件下优先招用。"
exceptions:
  - "从事接触职业病危害作业未进行离岗前职业健康检查的劳动者"
  - "在本单位患职业病或因工负伤并被确认丧失或部分丧失劳动能力的"
  - "患病或非因工负伤在医疗期内的劳动者"
  - "女职工在孕期、产期、哺乳期的"
  - "在本单位连续工作满十五年且距法定退休年龄不足五年的"
  - "优先留用：较长期限固定合同者、无固定期限合同者、家庭无其他就业者"
facts_required:
  - "企业裁员的法定事由及证明材料"
  - "裁减人员数量及占职工总数比例"
  - "是否已提前三十日向工会或全体职工说明情况"
  - "是否已将裁减人员方案报告劳动行政部门"
  - "被裁减人员是否存在禁止裁减的法定情形"
  - "被裁减人员的工作年限"
evidence_related:
  - "企业财务审计报告或经营困难证明"
  - "破产重整法院裁定书"
  - "向工会或全体职工说明情况的会议记录及签到表"
  - "裁减人员方案及向劳动行政部门的报告回执"
  - "工会意见书面记录"
  - "被裁减人员劳动合同及工作年限证明"
  - "经济补偿计算明细"
procedure_related:
  - "劳动监察（举报违法裁员）"
  - "劳动仲裁（主张违法解除赔偿金或经济补偿）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第四十一条", "第四十二条", "第四十六条"]
