rule_id: "labor_rule_004"
title: "劳动合同到期终止规则"
domain: "labor"
topic: "contract_expiration"
related_categories: ["contract_expiration"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "固定期限劳动合同期满"
  - "劳动合同约定的终止条件出现"
  - "劳动者开始依法享受基本养老保险待遇"
  - "劳动者死亡或被人民法院宣告死亡、失踪"
  - "用人单位被依法宣告破产"
  - "用人单位被吊销营业执照、责令关闭、撤销或提前解散"
legal_effect: "劳动合同期满或法定终止事由出现的，劳动合同终止。但除用人单位维持或提高条件续订劳动者不同意续订外，用人单位应当支付经济补偿。用人单位应出具有效终止证明并在十五日内为劳动者办理档案和社保关系转移手续。"
exceptions:
  - "从事接触职业病危害作业的劳动者未进行离岗前职业健康检查的，终止待检查完成"
  - "在本单位患职业病或因工负伤被确认丧失或部分丧失劳动能力的，按工伤保险条例处理"
  - "患病或非因工负伤在医疗期内的，合同顺延至医疗期届满"
  - "女职工在孕期、产期、哺乳期的，合同顺延至相应情形消失"
  - "在本单位连续工作满十五年且距退休不足五年的，不得终止（须续延至退休）"
facts_required:
  - "劳动合同期限及到期日期"
  - "终止原因（期满、退休、破产等）"
  - "劳动者是否存在法定顺延情形"
  - "用人单位是否已履行提前通知义务"
  - "是否为连续订立二次以上固定期限合同"
evidence_related:
  - "劳动合同及相关补充协议"
  - "终止劳动合同通知书及送达凭证"
  - "劳动者处于顺延期内的医学证明"
  - "用人单位破产或解散的司法/行政文件"
  - "工资支付台账"
procedure_related:
  - "劳动仲裁（主张违法终止赔偿金或经济补偿）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第四十四条", "第四十五条", "第四十六条", "第四十七条"]
