rule_id: labor_rule_060
title: 劳务外包与劳务派遣区分认定规则
domain: labor
topic: labor_outstaffing
related_categories:
- arbitration_period
- litigation_period
- evidence_preservation
- labor_outstaffing
jurisdiction: 全国
effective_from: '2014-03-01'
effective_to: null
status: active
conditions:
- 用人单位将业务外包给第三方公司
- 外包公司的员工在实际用工单位场所工作
- 外包员工受实际用工单位日常管理
- 外包员工穿用工单位统一工服、使用统一工位
- 实际用工单位直接向外包员工安排工作任务并进行考核
legal_effect: 劳务外包和劳务派遣的核心区别在于管理权的归属。劳务外包中，承包方自行管理员工、安排工作、进行考核，发包方只对工作成果进行验收；劳务派遣中，用工单位对被派遣劳动者进行日常管理、安排工作任务、实施绩效考核。发包单位将业务发包给不具备用工主体资格的组织或自然人，对该组织或自然人招用的劳动者，由具备用工主体资格的发包方承担用工主体责任。名为外包实为派遣的，应按劳务派遣规则处理，用工单位可能需承担连带责任。
exceptions:
- 承包方具备独立法人资格和相应资质且独立管理的，属于真实外包
- 发包方仅对工作成果验收不参与日常管理的，不构成用工关系
- 外包员工在发包方场所工作但受承包方管理的，仍属合法外包
facts_required:
- 发包方与承包方是否签订真实的外包合同
- 承包方是否具有独立的经营资质和用工资格
- 劳动者接受谁的日常管理和工作安排
- 劳动者由谁支付工资和缴纳社保
- 谁对劳动者进行考核和奖惩
evidence_related:
- 外包合同
- 劳务派遣协议（如有）
- 劳动合同
- 工资支付记录
- 社保缴纳记录
- 考勤记录
- 工作安排和考核记录
procedure_related:
- 劳动仲裁（确认用工关系性质）
- 法院诉讼
law_reference:
  law: 劳务派遣暂行规定
  articles:
  - 第二十七条
  - 第二十八条
