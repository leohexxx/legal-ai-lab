# 规则卡 - 经济补偿支付规则
# 来源：中华人民共和国劳动合同法 第四十六条、第四十七条
# 关联主题：wage_arrears

rule_id: "labor_rule_005"
title: "经济补偿支付规则"
domain: "labor"
topic: "wage_arrears"
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "劳动者依第三十八条解除劳动合同（含未足额支付报酬）"
  - "用人单位依第三十六条协商一致解除"
  - "用人单位依第四十条/四十一条解除"
  - "固定期限劳动合同期满终止（用人单位不续订或降低条件）"
  - "用人单位被宣告破产、吊销营业执照等导致终止"
legal_effect: "用人单位应按劳动者在本单位工作年限，每满一年支付一个月工资；六个月以上不满一年的按一年计算；不满六个月的支付半个月工资。月工资高于当地社平工资三倍的，按三倍计算且年限最高不超过十二年。"
exceptions:
  - "劳动者提出解除或主动辞职（非因第三十八条情形）"
  - "劳动者因过错被解除（第三十九条情形）"
  - "劳动合同期满劳动者不同意续订（用人单位维持或提高条件）"
  - "违法解除已支付赔偿金的，不再支付经济补偿"
facts_required:
  - "劳动合同解除或终止的原因"
  - "劳动者在本单位的工作年限"
  - "解除或终止前十二个月的月平均工资"
  - "当地上年度职工月平均工资"
evidence_related:
  - "劳动合同"
  - "解除/终止劳动合同证明"
  - "工资条"
  - "银行流水"
  - "工资支付台账"
procedure_related:
  - "劳动仲裁"
  - "法院诉讼"
source_id: "labor_contract_law_2012"
article_ref: "第四十六条、第四十七条"
review_status: "draft"
