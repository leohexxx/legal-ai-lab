rule_id: "labor_rule_013"
title: "年终奖金支付规则"
domain: "labor"
topic: "bonus_commission"
related_categories: ["bonus_commission"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "劳动合同或规章制度中明确约定了年终奖的发放条件和标准"
  - "用人单位单方规定年终奖发放时劳动者必须在册（即已离职的不发）"
  - "劳动者在年度内已提供劳动但因合同解除/终止未能在发放时在职"
legal_effect: "年终奖的发放首先依据劳动合同约定或用人单位的规章制度。若合同或制度明确约定年终奖与绩效考核挂钩，用人单位应按约定考核并发放。若用人单位随意克扣或拒发已约定的年终奖，劳动者可主张支付。司法实践中，对于年度内已提供劳动的劳动者，法院通常支持按工作时间比例折算年终奖。"
exceptions:
  - "劳动合同或规章制度未约定年终奖的，发放属于用人单位自主权"
  - "用人单位因经营效益不佳依法调整或取消年终奖的（需有制度依据）"
  - "劳动者因严重违纪被解除的，用人单位可依制度取消年终奖"
  - "年终奖发放前已主动辞职的劳动者，依单位制度可不发"
facts_required:
  - "劳动合同或规章制度是否约定了年终奖及发放条件"
  - "年终奖的计算标准（固定金额、绩效系数、公司利润比例等）"
  - "劳动者实际工作的时间（是否满全年）"
  - "劳动者是否达到考核条件"
  - "用人单位是否发放了年终奖及发放对象范围"
  - "公司的年度经营状况"
evidence_related:
  - "劳动合同（年终奖条款）"
  - "员工手册或薪酬管理制度"
  - "年度绩效考核结果"
  - "年终奖发放记录或通知"
  - "往年发放记录（证明发放惯例）"
  - "工资单"
procedure_related:
  - "劳动仲裁（主张年终奖支付）"
  - "法院诉讼"
law_reference:
  law: "中华人民共和国劳动合同法"
  articles: ["第十七条", "第二十九条"]
