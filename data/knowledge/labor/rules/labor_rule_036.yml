rule_id: labor_rule_036
title: 五级至十级伤残赔偿标准规则
domain: labor
topic: disability_grade
related_categories:
- injury_identification
- disability_grade
- lump_sum_compensation
- death_compensation
jurisdiction: 全国
effective_from: '2011-01-01'
effective_to: null
status: active
conditions:
- 职工因工致残被鉴定为五级至六级伤残
- 职工因工致残被鉴定为七级至十级伤残
- 五级至六级伤残职工本人提出解除或终止劳动关系
- 七级至十级伤残职工解除或终止劳动关系
legal_effect: 五级至六级伤残：一次性伤残补助金（五级18个月、六级16个月本人工资），保留劳动关系安排适当工作，难以安排工作的按月发伤残津贴（五级70%、六级60%本人工资）；经职工本人提出可解除劳动关系，由工伤保险基金支付一次性工伤医疗补助金，由用人单位支付一次性伤残就业补助金。七级至十级伤残：一次性伤残补助金（七级13个月、八级11个月、九级9个月、十级7个月本人工资）；劳动人事关系终止时，由工伤保险基金支付一次性工伤医疗补助金，由用人单位支付一次性伤残就业补助金。具体标准由省自治区直辖市人民政府规定。
exceptions:
- 五级至六级伤残职工保留与用人单位劳动关系，由用人单位安排适当工作
- 七级至十级伤残职工在合同期内可继续工作，解除时支付一次性补助
- 一次性工伤医疗补助金和就业补助金的具体标准各地不同
facts_required:
- 劳动能力鉴定结论（伤残等级）
- 工伤认定决定书
- 受伤前本人月平均工资
- 劳动关系是否解除或终止
- 所在省市的补助金具体标准
evidence_related:
- 工伤认定决定书
- 劳动能力鉴定结论通知书
- 劳动合同
- 工资条
- 解除或终止劳动合同证明
procedure_related:
- 劳动能力鉴定
- 工伤保险待遇申领
- 劳动仲裁
- 法院诉讼
law_reference:
  law: 工伤保险条例
  articles:
  - 第三十六条
  - 第三十七条
