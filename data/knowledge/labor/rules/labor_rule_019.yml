rule_id: "labor_rule_019"
title: "带薪年休假规则"
domain: "labor"
topic: "annual_leave"
related_categories: ["annual_leave"]
jurisdiction: "全国"
effective_from: "2008-01-01"
effective_to: null
status: "active"
conditions:
  - "劳动者连续工作满一年"
  - "劳动者依法享有带薪年休假"
  - "用人单位未安排劳动者休年休假"
legal_effect: "职工累计工作已满1年不满10年的，年休假5天；已满10年不满20年的，年休假10天；已满20年的，年休假15天。国家法定休假日、休息日不计入年休假假期。未休年休假的，用人单位应当按照该职工日工资收入的300%支付年休假工资报酬（含正常工资，实际额外支付200%）。"
exceptions:
  - "依法享受寒暑假的职工（如教师），其休假天数多于年休假天数的，不再享受年休假"
  - "职工请事假累计20天以上且单位按规定不扣工资的"
  - "累计工作满1年不满10年的职工，请病假累计2个月以上的"
  - "累计工作满10年不满20年的职工，请病假累计3个月以上的"
  - "累计工作满20年以上的职工，请病假累计4个月以上的"
  - "非全日制用工不适用带薪年休假规定"
facts_required:
  - "劳动者的累计工作年限"
  - "劳动者在本单位的工作年限"
  - "劳动者当年已休年假天数"
  - "用人单位是否安排年休假或发放未休报酬"
  - "劳动者当年是否享受了寒暑假或长期病假/事假"
evidence_related:
  - "劳动合同"
  - "社保缴纳记录（证明累计工作年限）"
  - "考勤记录（显示休假情况）"
  - "用人单位年休假安排通知"
  - "工资条（查看是否支付未休年假工资）"
  - "职工档案或离职证明（从原单位证明工作年限）"
procedure_related:
  - "劳动监察投诉"
  - "劳动仲裁（主张未休年假工资报酬）"
  - "法院诉讼"
law_reference:
  law: "职工带薪年休假条例"
  articles: ["第三条", "第五条"]
