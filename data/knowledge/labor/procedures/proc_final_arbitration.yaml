# 程序卡 - 劳动仲裁终局裁决（小额争议）
# 来源：中华人民共和国劳动争议调解仲裁法 第四十七条至第四十九条

procedure_id: "proc_final_arbitration"
title: "劳动仲裁终局裁决（小额争议）"
domain: "labor"
topic: "wage_arrears"
prerequisites:
  - "劳动争议属于下列类型之一：追索劳动报酬、工伤医疗费、经济补偿或赔偿金，且单项金额不超过当地月最低工资标准十二个月金额"
  - "因执行国家劳动标准在工作时间、休息休假、社会保险等方面发生的争议"
authority: "劳动争议仲裁委员会"
required_materials:
  - "仲裁申请书"
  - "身份证明"
  - "证据材料"
  - "用人单位信息"
steps:
  - step: 1
    action: "提交仲裁申请"
    detail: "向有管辖权的劳动争议仲裁委员会提交仲裁申请"
    timeline: "仲裁时效内（欠薪案劳动关系存续期间不限，终止后一年内）"
  - step: 2
    action: "受理、开庭"
    detail: "仲裁委员会受理后开庭审理"
    timeline: "受理后四十五日内结案"
  - step: 3
    action: "作出终局裁决"
    detail: "仲裁庭作出仲裁裁决，裁决书自作出之日起发生法律效力"
    timeline: "开庭后及时作出"
possible_outcomes:
  - "终局裁决支持请求（裁决立即生效）"
  - "终局裁决部分支持请求"
  - "终局裁决驳回请求"
  - "调解结案"
deadlines:
  - "仲裁时效：同一般劳动仲裁（一年/欠薪特殊规则）"
  - "裁决期限：受理后四十五日内"
  - "劳动者起诉期限：收到裁决书后十五日内向法院起诉（劳动者有特殊保护）"
  - "用人单位申请撤销期限：收到裁决书后三十日内向中院申请撤销"
  - "用人单位申请撤销的法定事由：适用法律错误、违反法定程序、证据伪造、隐瞒证据、仲裁员枉法等"
jurisdiction: "劳动合同履行地或用人单位所在地的劳动争议仲裁委员会"
risks: "终局裁决对用人单位具有约束力，用人单位不能仅因不服裁决而直接起诉，必须符合法定撤销事由。劳动者仍保留起诉权，可在收到裁决后十五日内向法院起诉。仲裁裁决同时包含终局和非终局事项的，按非终局裁决处理"
