# 程序卡 - 法院诉讼（劳动争议）
# 来源：中华人民共和国劳动争议调解仲裁法 第五十条、司法解释（一）

procedure_id: "proc_court_litigation"
title: "法院诉讼（劳动争议）"
domain: "labor"
topic: "wage_arrears"
prerequisites:
  - "已经过劳动争议仲裁程序（仲裁前置原则）"
  - "对仲裁裁决不服（含终局裁决劳动者不服）"
  - "在法定期限内提起诉讼"
  - "仲裁委员会逾期未作出受理决定或仲裁裁决（特殊情形可直诉）"
authority: "用人单位所在地或劳动合同履行地的基层人民法院"
required_materials:
  - "起诉状"
  - "原告身份证明"
  - "仲裁裁决书或不予受理通知书"
  - "仲裁阶段提交的全部证据材料"
  - "新证据（如有）"
steps:
  - step: 1
    action: "收到仲裁裁决"
    detail: "劳动争议仲裁委员会作出仲裁裁决后，当事人不服裁决"
    timeline: "收到裁决书之日起十五日内"
  - step: 2
    action: "提起诉讼"
    detail: "向有管辖权的基层人民法院提交起诉状"
    timeline: "收到仲裁裁决书后十五日内"
  - step: 3
    action: "立案审查"
    detail: "法院审查起诉材料，符��条件予以立案"
    timeline: "收到起诉状后七日内决定是否立案"
  - step: 4
    action: "开庭审理"
    detail: "法院开庭审理劳动争议案件，先行调解"
    timeline: "简易程序三个月，普通程序六个月"
  - step: 5
    action: "判决"
    detail: "法院作出民事判决"
    timeline: "开庭后及时作出"
  - step: 6
    action: "上诉（如有需要）"
    detail: "不服一审判决的，可向上一级法院上诉"
    timeline: "收到判决书后十五日内"
possible_outcomes:
  - "支持全部诉讼请求"
  - "部分支持诉讼请求"
  - "驳回全部诉讼请求"
  - "调解结案"
  - "裁定不予受理或驳回起诉"
deadlines:
  - "起诉期限：收到仲裁裁决书后十五日内"
  - "终局裁决劳动者起诉期限：收到裁决书后十五日内"
  - "终局裁决用人单位申请撤销期限：收到裁决书后三十日内向中院申请撤销"
  - "一审审限：简易程序三个月，普通程序六个月"
  - "上诉期限：收到一审判决书后十五日内"
jurisdiction: "用人单位所在地或劳动合同履行地的基层人民法院；劳动合同履行地不明确的，由用人单位所在地基层法院管辖"
risks: "劳动争议须先经仲裁程序（仲裁前置），未经仲裁的法院不予受理。但以工资欠条为据仅追索欠薪不涉及其他争议的，可按普通民事纠纷直接起诉。诉讼费较低（一般每件10元）"
