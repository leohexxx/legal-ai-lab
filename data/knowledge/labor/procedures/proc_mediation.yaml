# 程序卡 - 调解（企业调解/人民调解）
# 来源：中华人民共和国劳动争议调解仲裁法 第十条至第十六条、司法解释（一）第五十一条至第五十二条

procedure_id: "proc_mediation"
title: "调解（企业调解/人民调解）"
domain: "labor"
topic: "wage_arrears"
prerequisites:
  - "已发生劳动争议"
  - "双方愿意接受调解"
  - "未超过仲裁时效"
authority: "企业劳动争议调解委员会、依法设立的基层人民调解组织、乡镇街道设立的具有劳动争议调解职能的组织"
required_materials:
  - "劳动争议相关证据材料"
  - "身份证明"
  - "调解申请书（口头或书面）"
steps:
  - step: 1
    action: "申请调解"
    detail: "向企业劳动争议调解委员会或基层人民调解组织等调解组织提出调解申请"
    timeline: "劳动争议发生后及时申请"
  - step: 2
    action: "受理调解"
    detail: "调解组织受理调解申请，了解争议基本情况"
    timeline: "收到申请后及时受理"
  - step: 3
    action: "调解"
    detail: "调解员听取双方意见，促成双方达成调解协议"
    timeline: "调解期限一般不超过十五日"
  - step: 4
    action: "达成调解协议"
    detail: "双方达成调解协议的，制作调解协议书。涉及给付义务的调解协议，可就劳动报酬争议直接起诉或申请司法确认"
    timeline: "调解成功后及时签订"
  - step: 5
    action: "履行或转入仲裁"
    detail: "按调解协议履行，或协议不履行的申请仲裁。在调解组织主持下仅就劳动报酬争议达成调解协议的，用人单位不履行的，劳动者可直接起诉（按普通民事纠纷）"
    timeline: "调解不成或调解协议不履行的，应在仲裁时效内申请仲裁"
possible_outcomes:
  - "达成调解协议并履行"
  - "达成调解协议但一方不履行（可申请仲裁或直接起诉）"
  - "调解不成（可申请仲裁）"
deadlines:
  - "调解不影响仲裁时效，调解期间仲裁时效不停止计算，需注意在时效内申请仲裁"
  - "调解协议可向法院申请司法确认（人民调解委员会主持下达成的调解协议）"
jurisdiction: "企业劳动争议调解委员会设在用人单位内部；人民调解组织设在村/居委会或乡镇/街道"
risks: "调解不收费，程序灵活快捷。调解协议具有劳动合同约束力可作为裁判依据，但不具有直接强制执行力。可申请司法确认以获得强制执行效力"
