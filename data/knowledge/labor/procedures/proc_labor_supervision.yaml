# 程序卡 - 劳动监察投诉
# 来源：劳动保障监察条例 第九条至第十八条

procedure_id: "proc_labor_supervision"
title: "劳动监察投诉"
domain: "labor"
topic: "wage_arrears"
prerequisites:
  - "用人单位存在违反劳动保障法律、法规或规章的行为"
  - "违法行为在2年追诉期内"
  - "未就同一事项申请劳动仲裁或提起诉讼（监察与仲裁/诉讼程序不兼容）"
authority: "用人单位用工所在地的县级或设区的市级劳动保障行政部门（劳动监察大队）"
required_materials:
  - "投诉人身份证明"
  - "证明用人单位违法行为的证据材料"
  - "劳动关系证明（劳动合同、工牌、工资条等）"
steps:
  - step: 1
    action: "提交投诉"
    detail: "向用人单位所在地的劳动监察机构提交投诉，可以书面或口头方式。也可通过电话12333、线上平台等渠道投诉"
    timeline: "发现违法行为后尽快投诉"
  - step: 2
    action: "立案审查"
    detail: "劳动保障行政部门审核投诉材料，决定是否立案"
    timeline: "收到投诉后及时决定"
  - step: 3
    action: "调查取证"
    detail: "劳动监察员进入用人单位劳动场所检查，询问相关人员，查阅必要资料。调查不得少于2人，应出示监察证件"
    timeline: "立案之日起60个工作日内完成调查（复杂案件可延长30个工作日）"
  - step: 4
    action: "作出处理"
    detail: "根据调查结果作出处理：依法处罚、责令改正或撤销立案"
    timeline: "调查结束后及时作出"
  - step: 5
    action: "责令支付"
    detail: "对欠薪等违法行为，作出责令改正决定，限期支付工资报酬"
    timeline: "逾期不支付的，责令加付50%-100%赔偿金"
possible_outcomes:
  - "责令用人单位限期支付工资报酬"
  - "责令用人单位加付赔偿金（逾期不支付时）"
  - "行政处罚（罚款）"
  - "移送司法机关（涉嫌拒不支付劳动报酬罪）"
  - "撤销立案（违法情节轻微已改正）"
deadlines:
  - "追诉时效：违反劳动保障法律行为在2年内未被发现、举报、投诉的，不再查处"
  - "调查期限：自立案之日起60个工作日内完成，复杂案件可延长30个工作日"
  - "责令支付期限：具体期限由劳动监察部门决定"
jurisdiction: "用人单位用工所在地的县级或设区的市级劳动保障行政部门"
risks: "劳动监察投诉不收费，但只能处理行政违法责任，不能处理劳动争议中复杂的事实认定问题。如争议事项超出监察范围，将被告知按劳动争议程序处理"
