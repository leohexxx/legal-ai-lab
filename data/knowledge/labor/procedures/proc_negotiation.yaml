# 程序卡 - 协商和解
# 来源：中华人民共和国劳动争议调解仲裁法 第四条

procedure_id: "proc_negotiation"
title: "协商和解"
domain: "labor"
topic: "wage_arrears"
prerequisites:
  - "已发生劳动争议"
  - "双方有协商意愿"
  - "尚未超过仲裁时效"
authority: "劳动者与用人单位双方自行协商，也可请工会或第三方参与"
required_materials:
  - "相关证据材料（证明欠薪事实）"
  - "协商方案（还款计划等）"
steps:
  - step: 1
    action: "提出协商要求"
    detail: "劳动者向用人单位提出协商解决欠薪问题的要求，可以口头或书面方式"
    timeline: "发现欠薪后尽快提出"
  - step: 2
    action: "进行协商"
    detail: "双方就欠薪金额、支付期限、支付方式等进行协商。可邀请工会或第三方参与"
    timeline: "协商时间双方确定"
  - step: 3
    action: "达成和解协议"
    detail: "双方就欠薪解决方案达成一致，签订和解协议。协议应明确欠薪金额、支付期限、违约责任等"
    timeline: "协商达成后及时签订"
  - step: 4
    action: "履行协议"
    detail: "用人单位按照和解协议约定支付欠薪"
    timeline: "按协议约定的期限履行"
possible_outcomes:
  - "达成和解协议并履行（欠薪得到解决）"
  - "达成和解协议但用人单位不履行（可申请仲裁或起诉）"
  - "协商不成（可申请调解或仲裁）"
deadlines:
  - "协商不成的，应及时申请仲裁以防超过仲裁时效（劳动争议一般一年）"
  - "欠薪案在劳动关系存续期间仲裁时效不受限制，但劳动关系终止后一年内需提出"
jurisdiction: "不适用"
risks: "协商和解不收费，是最快速便捷的解决方式。但和解协议不具有强制执行力，若用人单位不履行协议仍需申请仲裁。签订协议时注意不要放弃其他合法权益"
