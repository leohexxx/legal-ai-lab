# 程序卡 - 劳动仲裁
# 来源：中华人民共和国劳动争议调解仲裁法 第五条、第二十七条至第五十条

procedure_id: "proc_labor_arbitration"
title: "劳动仲裁"
domain: "labor"
topic: "wage_arrears"
prerequisites:
  - "已发生劳动争议"
  - "属于劳动争议仲裁委员会管辖范围"
  - "在仲裁时效期间内"
authority: "劳动争议仲裁委员会（劳动合同履行地或用人单位所在地）"
required_materials:
  - "仲裁申请书（载明请求事项、事实与理由）"
  - "申请人身份证明"
  - "被申请人（用人单位）信息"
  - "相关证据材料（证明劳动关系、欠薪事实等）"
  - "授权委托书（如有代理人）"
steps:
  - step: 1
    action: "提交仲裁申请"
    detail: "向有管辖权的劳动争议仲裁委员会提交书面仲裁申请及证据材���"
    timeline: "自知道或应当知道权利被侵害之日起一年内（欠薪案：劳动关系存续期间不受限，终止后一年内）"
  - step: 2
    action: "受理审查"
    detail: "仲裁委员会审查申请材料，决定是否受理。不符合受理条件的，出具不予受理通知书"
    timeline: "收到申请后五日内决定是否受理"
  - step: 3
    action: "答辩与举证"
    detail: "受理后将仲裁申请书副本送达被申请人，被申请人在规定期限内提交答辩书和证据"
    timeline: "被申请人收到申请书副本后十日内提交答辩书"
  - step: 4
    action: "开庭审理"
    detail: "仲裁庭开庭审理案件，首先进行调解。调解不成的进行仲裁审理"
    timeline: "受理后四十五日内结案（可延期不超过十五日）"
  - step: 5
    action: "裁决"
    detail: "仲裁庭根据审理情况作出仲裁裁决"
    timeline: "开庭后及时作出裁决"
possible_outcomes:
  - "支持请求（完全支持劳动者诉求）"
  - "部分支持（部分支持劳动者诉求）"
  - "驳回请求"
  - "调解结案（双方达成调解协议）"
  - "视为撤回申请（申请人无正当理由不到庭）"
  - "缺席裁决（被申请人无正当理由不到庭）"
deadlines:
  - "仲裁时效：一年（自知道或应当知道权利被侵害之日起计算）"
  - "欠薪仲裁时效特别规定：劳动关系存续期间不受一年限制，劳动关系终止后一年内提出"
  - "受理期限：收到申请后五日内"
  - "裁决期限：受理仲裁申请后四十五日内结案，可延长不超过十五日"
  - "起诉期限：收到裁决书后十五日内向人民法院起诉"
jurisdiction: "劳动合同履行地或者用人单位所在地的劳动争议仲裁委员会"
risks: "仲裁不收费（劳动争议仲裁委员会经费由财政保障）。但需准备充分证据，证据不足可能导致请求被驳回。对仲裁裁决不服的，需在收到裁决书后十五日内起诉，逾期裁决生效"
