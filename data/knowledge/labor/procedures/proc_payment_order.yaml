# 程序卡 - 申请支付令
# 来源：中华人民共和国劳动合同法 第三十条、司法解释（一）第十三条

procedure_id: "proc_payment_order"
title: "申请支付令"
domain: "labor"
topic: "wage_arrears"
prerequisites:
  - "用人单位拖欠或未足额支付劳动报酬"
  - "债权债务关系明确、合法"
  - "没有其他债务纠纷"
  - "支付令能够送达用人单位"
authority: "有管辖权的基层人民法院"
required_materials:
  - "支付令申请书"
  - "申请人身份证明"
  - "证明债权债务关系明确的证据（劳动合同、工资欠条、工资条等）"
  - "用人单位（被申请人）信息"
steps:
  - step: 1
    action: "提交支付令申请"
    detail: "劳动者向有管辖权的基层人民法院提交支付令申请书，载明请求事项和事实理由"
    timeline: "发现欠薪后及时申请"
  - step: 2
    action: "法院审查"
    detail: "法院审查申请是否符合督促程序条件"
    timeline: "收到申请后五日内决定是否受理"
  - step: 3
    action: "发出支付令"
    detail: "法院经审查认为符合条件的，向用人单位发出支付令"
    timeline: "受理后十五日内发出（事实清楚、债权债务关系明确）"
  - step: 4
    action: "用人单位异议或履行"
    detail: "用人单位在收到支付令后，可在法定期限内提出书面异议或履行支付义务"
    timeline: "收到支付令后十五日内"
possible_outcomes:
  - "用人单位在法定期限内履行支付义务（欠薪解决）"
  - "用人单位在法定期限内提出书面异议（支付令失效，转入仲裁或诉讼）"
  - "用人单位在法定期限内不履行也不异议（支付令生效，可申请强制执行）"
  - "法院裁定驳回申请（不符合督促程序条件）"
deadlines:
  - "法院受理后十五日内发出支付令"
  - "用人单位收到支付令后十五日内提出异议或履行"
  - "支付令生效后债权人可在两年内申请强制执行"
jurisdiction: "有管辖权的基层人民法院（一般为用人单位所在地或合同履行地）"
risks: "支付令程序简便快速，劳动者在劳动合同法第三十条第二款下可直接申请，无需仲裁前置。但用人单位提出书面异议后支付令即失效，劳动者需转仲裁程序。支付令被裁定终结督促程序后，劳动争议事项仍应先行仲裁"
