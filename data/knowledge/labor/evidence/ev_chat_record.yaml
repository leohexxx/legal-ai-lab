# 证据卡 - 聊天记录
# 证明催讨工资、工作安排等事实的电子证据
# 来源：中华人民共和国民事诉讼法 第六十六条

evidence_id: "ev_chat_record"
name: "聊天记录"
evidence_type: "electronic"
description: "微信、钉钉、短信等即时通讯工具中与用人单位负责人、人事、同事之间涉及工作安排、工资催讨、加班确认等对话记录"
supports:
  - "证明向用人单位催讨工资的事实"
  - "证明用人单位确认欠薪或承诺支付"
  - "证明工作安排和加班安排"
  - "证明劳动关系存续状态"
cannot_prove_alone:
  - "证明确切的欠薪金额"
  - "证明劳动关系的存在（需结合劳动合同或工作证等）"
preservation_tips: "保存原始聊天记录，不删除。必要时进行截图或录屏，确保能显示双方身份信息和时间戳。建议通过法院或公证处进行电子证据保全公证"
privacy_risks: "聊天记录可能包含个人隐私及其他无关对话，提交前应筛选与案件相关的部分"
domain: "labor"
topic: "wage_arrears"
