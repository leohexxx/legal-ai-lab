# 证据卡 - 工作邮件
# 证明工作安排、工资约定和加班事实的电子证据
# 来源：中华人民共和国民事诉讼法 第六十六条

evidence_id: "ev_work_email"
name: "工作邮件"
evidence_type: "electronic"
description: "劳动者与用人单位之间往来工作邮件，涉及工作安排、工资调整、加班通知、请假审批等内容"
supports:
  - "证明工作安排和任务分配"
  - "证明加班通知或加班安排"
  - "证明工资调整或奖金承诺"
  - "证明请假审批情况"
  - "证明双方沟通记录"
cannot_prove_alone:
  - "证明实际工资发放金额"
  - "证明劳动关系存在（需结合劳动合同）"
preservation_tips: "保留邮箱中所有相关邮件，不要删除。可以通过截屏或导出为PDF格式保存。必要时进行公证"
privacy_risks: "工作邮件可能包含公司机密信息和其他员工的个人信息，提交前注意筛选"
domain: "labor"
topic: "wage_arrears"
