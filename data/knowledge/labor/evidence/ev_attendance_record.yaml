# 证据卡 - 考勤记录
# 证明劳动出勤和加班事实的重要证据
# 来源：最高人民法院关于审理劳动争议案件适用法律问题的解释（一） 第四十二条

evidence_id: "ev_attendance_record"
name: "考勤记录"
evidence_type: "electronic"
description: "记载劳动者每日出勤、迟到、早退、请假及加班情况的记录，包括纸质签到表、电子考勤系统记录等"
supports:
  - "证明出勤天数和工作时长"
  - "证明加班事实的存在"
  - "证明请假情况"
  - "证明考勤异常（迟到、早退等）"
cannot_prove_alone:
  - "证明实际工资发放金额"
  - "证明约定工资标准"
preservation_tips: "考勤记录一般由用人单位掌握，劳动者可要求用人单位提供。劳动者自己应保存考勤打卡截图、考勤记录表复印件等。仲裁中用人单位不提供的，应承担不利后果"
privacy_risks: "通常不涉及隐私风险，但考勤记录截图如含其他员工信息，建议做脱敏处理"
domain: "labor"
topic: "wage_arrears"
