# 证据卡 - 证人证言
# 通过第三方证词证明劳动关系或欠薪事实
# 来源：中华人民共和国劳动争议调解仲裁法 第六条

evidence_id: "ev_witness"
name: "证人证言"
evidence_type: "witness"
description: "了解案件情况的其他劳动者、同事或相关人员就劳动关系、工资支付、工作事实等出庭作证的陈述"
supports:
  - "证明劳动关系的存在"
  - "证明工资支付情况"
  - "证明工作内容和考勤情况"
  - "证明加班事实"
cannot_prove_alone:
  - "证明确切的欠薪金额（证人证言属于辅助证据，需与其他书证印证）"
  - "证明劳动合同约定的工资标准"
preservation_tips: "提前与证人沟通，确认证人愿意出庭作证。准备证人证言书面材料，证人需携带身份证明出庭。证人与当事人有亲属或利害关系的，其证言证明力较低"
privacy_risks: "证人的个人信息可能需要向法庭提供，证人应注意自身安全和隐私"
domain: "labor"
topic: "wage_arrears"
