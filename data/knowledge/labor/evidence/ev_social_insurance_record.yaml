# 证据卡 - 社保缴费记录
# 证明劳动关系和工资基数的权威证据
# 来源：中华人民共和国劳动合同法 第十七条、中华人民共和国社会保险法

evidence_id: "ev_social_insurance_record"
name: "社保缴费记录"
evidence_type: "electronic"
description: "社会保险经办机构出具的劳动者社会保险缴费明细，显示缴费基数和缴费单位"
supports:
  - "证明劳动关系的存在"
  - "证明缴费单位（用人单位）"
  - "证明缴费基数（可间接反映工资水平）"
  - "证明劳动关系的起止时间和连续性"
cannot_prove_alone:
  - "证明实际到手工资数额（社保缴费基数可能与实际工资不完全一致）"
  - "证明加班费和经济补偿等其他争议事项"
preservation_tips: "可通过当地社保局官网、社保APP或前往社保经办机构打印社保缴费证明。建议每年查询并保存缴费记录"
privacy_risks: "包含个人身份信息、社保账号等敏感信息，提交时应注意保密"
domain: "labor"
topic: "wage_arrears"
