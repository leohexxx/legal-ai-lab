# 证据卡 - 劳动合同
# 证明劳动关系和工资约定的核心书证
# 来源：中华人民共和国劳动合同法 第十六条、第十七条

evidence_id: "ev_labor_contract"
name: "劳动合同"
evidence_type: "document"
description: "劳动者与用人单位之间确立劳动关系、明确双方权利义务的书面协议，须载明劳动报酬、工作内容、合同期限等必备条款"
supports:
  - "证明劳动关系的存在"
  - "证明约定工资标准"
  - "证明工作岗位和工作内容"
  - "证明合同期限"
  - "证明工作时间和休息休假约定"
cannot_prove_alone:
  - "证明工资实际发放情况"
  - "证明考勤和加班事实"
  - "证明劳动关系解除的原因"
preservation_tips: "劳动合同由用人单位和劳动者各执一份。劳动者应妥善保管原件，如用人单位未交付合同文本，可向劳动行政部门投诉要求责令改正"
privacy_risks: "合同中包含个人身份信息、薪资信息等隐私内容，提交时应注意不向无关方泄露"
domain: "labor"
topic: "wage_arrears"
