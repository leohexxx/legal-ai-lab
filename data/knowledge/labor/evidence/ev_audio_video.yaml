# 证据卡 - 录音/录像
# 证明欠薪事实和用人单位表态的视听资料
# 来源：中华人民共和国民事诉讼法 第六十六条

evidence_id: "ev_audio_video"
name: "录音/录像"
evidence_type: "electronic"
description: "劳动者与用人单位负责人或人事就工资支付、工作安排等事项进行沟通的录音或录像"
supports:
  - "证明用人单位承认欠薪的事实"
  - "证明用人单位承诺支付工资"
  - "证明双方约定的工资标准"
  - "证明劳动关系存在"
cannot_prove_alone:
  - "证明完整的工资支付记录"
  - "证明考勤和加班时长"
preservation_tips: "录音/录像应保存在原始设备中，不得剪辑、编辑。重要的录音建议刻录光盘或存入U盘。开庭时可提交完整的录音文字整理稿作为辅助材料"
privacy_risks: "未经对方同意的录音虽可作为证据（不违法），但提交时应注意不扩散传播。涉及他人隐私的内容应做脱敏处理"
domain: "labor"
topic: "wage_arrears"
