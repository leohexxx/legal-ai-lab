# 证据卡 - 银行流水
# 证明工资实际发放到账的客观记录
# 来源：中华人民共和国劳动法 第五十条

evidence_id: "ev_bank_statement"
name: "银行流水"
evidence_type: "electronic"
description: "显示工资发放记录的银行账户交易流水，可体现发薪金额、发薪主体和发薪周期"
supports:
  - "证明工资实际发放金额"
  - "证明发薪主体（付款方账户名）"
  - "证明发薪周期和是否按时发放"
  - "证明工资发放的历史连续性"
cannot_prove_alone:
  - "证明约定工资标准"
  - "证明劳动关系存在（需结合劳动合同）"
  - "证明现金发放部分的工资"
preservation_tips: "建议前往银行打印近2-3年的流水明细，或使用手机银行导出带电子印章的电子版。打印时注意选择含交易对手信息的详细版"
privacy_risks: "包含个人银行账号及全部交易记录信息，提交前建议遮盖非必要的交易记录"
domain: "labor"
topic: "wage_arrears"
