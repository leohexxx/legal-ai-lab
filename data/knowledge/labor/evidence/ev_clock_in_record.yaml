# 证据卡 - 考勤打卡记录
# 电子考勤系统的打卡记录，证明出勤和加班的客观证据
# 来源：最高人民法院关于审理劳动争议案件适用法律问题的解释（一） 第四十二条

evidence_id: "ev_clock_in_record"
name: "考勤打卡记录"
evidence_type: "electronic"
description: "用人单位考勤系统（指纹、人脸识别、钉钉、企业微信等）记录的每日打卡时间，包含上班签到、下班签退及加班打卡记录"
supports:
  - "证明每日出勤时间和工作时长"
  - "证明加班事实和具体加班时长"
  - "证明迟到、早退情况"
  - "证明请假日期"
cannot_prove_alone:
  - "证明工资实际发放金额"
  - "证明约定工资标准"
  - "单独作为劳动关系认定的充分证据"
preservation_tips: "劳动者应保留考勤APP的打卡截图，导出考勤报表。考勤数据一般由用人单位系统保存，劳动者可要求用人单位提供考勤记录。仲裁中用人单位不提供的，由用人单位承担不利后果"
privacy_risks: "打卡记录一般不涉及隐私，但部分考勤系统含定位信息，提交时注意"
domain: "labor"
topic: "wage_arrears"
