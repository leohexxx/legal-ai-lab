# 证据卡 - 工资支付台账
# 用人单位掌握的工资支付记录（举证责任倒置时关键）
# 来源：中华人民共和国劳动合同法 第五十条、劳动保障监察条例 第十五条

evidence_id: "ev_payroll_account"
name: "工资支付台账"
evidence_type: "electronic"
description: "用人单位制作的工资支付记录表，记载劳动者姓名、工资标准、应发金额、扣款明细、实发金额、领款签字等信息"
supports:
  - "证明用人单位支付工资的完整记录"
  - "证明工资构成和扣款项目"
  - "证明是否存在欠薪"
  - "证明发薪周期"
cannot_prove_alone:
  - "证明约定工资标准（需结合劳动合同）"
  - "劳动关系终止后超过两年的部分工资台账可能已销毁"
preservation_tips: "工资支付台账由用人单位掌握和保管，劳动者无法直接获取。仲裁时劳动者可申请仲裁庭要求用人单位提供。用人单位对已解除或终止的劳动合同文本至少保存二年"
privacy_risks: "包含全部员工工资信息，属公司保密资料"
domain: "labor"
topic: "wage_arrears"
