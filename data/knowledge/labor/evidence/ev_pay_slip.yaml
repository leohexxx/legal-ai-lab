# 证据卡 - 工资条/工资单
# 证明工资发放金额和构成的关键证据
# 来源：中华人民共和国劳动法 第五十条

evidence_id: "ev_pay_slip"
name: "工资条/工资单"
evidence_type: "document"
description: "用人单位每月向劳动者出具的工资明细清单，列明应发工资、扣款项目和实发工资"
supports:
  - "证明实际支付的工资金额"
  - "证明工资构成（基本工资、加班费、奖金、津贴等）"
  - "证明社保、公积金的扣缴情况"
  - "证明发薪周期"
cannot_prove_alone:
  - "证明约定工资标准"
  - "证明劳动关系存在（需结合劳动合同）"
  - "证明考勤和加班时长"
preservation_tips: "建议每月保存工资条的纸质版或电子版（拍照或扫描），至少保存至劳动关系终止后一年以上"
privacy_risks: "包含个人薪资信息、社保扣缴信息，提交时注意保护个人隐私"
domain: "labor"
topic: "wage_arrears"
