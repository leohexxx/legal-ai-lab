case_id: "labor_case_030"
title: "曹某诉青岛某物流公司劳动争议证据保全案"
domain: "labor"
related_categories:
  - "evidence_preservation"
source: "参考：青岛市中级人民法院（2023）鲁02民终2345号"
publish_date: "2023-05-08"
summary: "曹某于2019年8月入职青岛某物流公司担任驾驶员，月薪按趟次计算（平均约8,000元/月）。2023年1月曹某被公司辞退，申请仲裁要求公司支付经济补偿和加班费。但曹某未能提供考勤记录、工资明细等关键证据，这些证据由公司掌握。曹某申请仲裁委责令公司提供相关证据，公司声称'考勤系统已升级，历史数据无法恢复'拒绝提供。"
facts: 
  - "曹某于2019年8月15日入职青岛某物流公司担任货车驾驶员，按趟次计酬，平均月薪约8,000元"
  - "2023年1月20日公司口头通知曹某'不用再来上班了'，未出具书面解除通知"
  - "曹某要求公司支付经济补偿（3.5个月工资）和加班费（大量节假日出车），合计约42,000元"
  - "考勤记录、出车单、工资明细等关键证据均由公司掌握，曹某无法获取"
  - "公司声称'2022年底考勤系统升级，历史数据已无法恢复'，拒绝提供曹某的考勤和工资记录"
  - "曹某仅能提供部分微信聊天截图和行车记录仪视频作为辅助证据"
dispute_focus: "关键证据由用人单位掌握而用人单位拒不提供或声称数据已灭失的，仲裁委应如何分配举证责任"
judgment: "仲裁委和法院认定：根据《劳动争议调解仲裁法》第六条和《劳动争议司法解释（一）》第四十二条，与争议事项有关的证据属于用人单位掌握管理的，用人单位应当提供；不提供的应当承担不利后果。公司声称考勤系统升级数据不可恢复，但在曹某离职前1个月仍在正常使用考勤系统，且公司未提供任何系统升级记录或第三方证明。仲裁委依法采信曹某的主张，依据曹某提供的辅助证据（部分微信记录和行车记录仪视频）综合认定曹某的工作时间、加班事实和工资标准。裁决公司支付经济补偿28,000元及加班费15,000元，合计43,000元。"
key_rules_applied: 
  - rule_id: "labor_rule_058"
    explanation: "发生劳动争议，当事人对自己提出的主张有责任提供证据。与争议事项有关的证据属于用人单位掌握管理的，用人单位应当提供。"
  - rule_id: "labor_rule_059"
    explanation: "用人单位拒不提供或销毁由其掌握的关键证据的，仲裁委或法院可以采信劳动者的主张，认定相关事实成立。"
legal_principles: 
  - "与争议事项有关的证据属于用人单位掌握管理的，用人单位应当提供"
  - "用人单位拒不提供或声称证据已灭失但不能证明的，应承担不利后果"
  - "劳动者提供初步证据后，举证责任转移至用人单位"
relevance_score: 0.89
