case_id: "labor_case_005"
title: "赵某诉杭州某科技公司无固定期限劳动合同签订纠纷案"
domain: "labor"
related_categories:
  - "contract_renewal"
  - "contract_conclusion"
source: "参考：浙江省杭州市中级人民法院（2023）浙01民终2345号"
publish_date: "2023-05-10"
summary: "赵某于2014年3月入职杭州某科技公司，先后签订两次固定期限劳动合同，第二次合同于2022年2月到期。合同到期前赵某书面提出要求签订无固定期限劳动合同，公司以'需要重新评估岗位匹配度'为由拒绝，并通知赵某合同到期后不再续签。赵某申请仲裁要求公司签订无固定期限劳动合同。"
facts: 
  - "赵某于2014年3月10日入职杭州某科技公司，月薪15,000元"
  - "双方签订了两次固定期限劳动合同，第一次为2014年3月至2017年3月，第二次为2017年3月至2022年2月"
  - "第二次合同到期前30天，赵某书面提交申请要求公司与其签订无固定期限劳动合同"
  - "公司以'需要重新评估岗位匹配度'为由拒绝，并于2022年2月28日通知赵某合同到期终止不再续签"
  - "赵某在岗期间考核均为合格以上，无任何违纪或不能胜任工作的记录"
dispute_focus: "连续订立两次固定期限劳动合同后，劳动者提出签订无固定期限劳动合同的，用人单位是否有权拒绝"
judgment: "仲裁委支持赵某请求，裁决公司应与赵某签订无固定期限劳动合同。公司不服起诉，一、二审法院均认为：赵某已连续两次订立固定期限劳动合同且不存在劳动合同法第三十九条和第四十条第一、二项规定的情形，赵某提出续签无固定期限合同于法有据。判决公司在判决生效后10日内与赵某签订无固定期限劳动合同，并补发合同到期后至实际签订期间的工资损失。"
key_rules_applied: 
  - rule_id: "labor_rule_023"
    explanation: "连续订立两次固定期限劳动合同，且劳动者没有第三十九条和第四十条第一、二项规定情形的，劳动者提出或同意续订合同的，除劳动者提出订立固定期限合同外，用人单位应订立无固定期限合同。"
  - rule_id: "labor_rule_001"
    explanation: "用人单位应当与劳动者签订书面劳动合同。符合签订无固定期限劳动合同条件而拒绝签订的，劳动者有权要求继续履行。"
legal_principles: 
  - "连续订立两次固定期限劳动合同后，劳动者提出续签无固定期限劳动合同的，用人单位不得拒绝"
  - "用人单位单方拒绝签订无固定期限劳动合同的，构成违法终止，劳动者有权要求继续履行"
  - "无固定期限劳动合同不是'铁饭碗'，但体现了对长期稳定劳动关系的法律保护"
relevance_score: 0.93
