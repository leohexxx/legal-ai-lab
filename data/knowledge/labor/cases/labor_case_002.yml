case_id: "labor_case_002"
title: "李某诉北京某教育科技有限公司违法解除劳动合同案"
domain: "labor"
related_categories:
  - "illegal_termination"
  - "contract_conclusion"
source: "参考：北京市第三中级人民法院（2023）京03民终5678号"
publish_date: "2023-03-20"
summary: "李某于2019年6月入职北京某教育科技公司担任运营经理，月薪18,000元。2022年12月公司以李某'严重违反公司规章制度'为由单方解除劳动合同，但李某称从未见过该规章制度，公司也无法证明规章制度已向员工公示。李某遂申请仲裁要求支付违法解除赔偿金。"
facts: 
  - "李某于2019年6月15日入职北京某教育科技公司，签订三年劳动合同，任运营经理，月薪18,000元"
  - "2022年12月10日公司向李某送达《解除劳动合同通知书》，理由为'严重违反公司规章制度'，具体为'未经审批私自使用公司服务器资源'"
  - "李某在解除前12个月平均工资为18,500元，在公司工作3年6个月"
  - "公司无法提供该规章制度经过民主程序制定的证据，也无法证明已向李某公示或送达"
  - "公司服务器使用记录显示李某的行为已获其直属上级口头同意"
dispute_focus: "用人单位以严重违纪为由解除劳动合同，但无法证明规章制度已向劳动者公示的，解除是否合法"
judgment: "仲裁委裁决公司违法解除劳动合同，应当支付赔偿金。公司不服起诉，一审、二审法院均认定：公司规章制度未向李某公示，不能作为解除依据，且李某行为已获上级同意不构成严重违纪。判决公司支付违法解除赔偿金共计129,500元（18,500元/月×3.5年×2倍）。"
key_rules_applied: 
  - rule_id: "labor_rule_006"
    explanation: "用人单位以劳动者严重违反规章制度为由解除劳动合同，但规章制度未经民主程序制定或未向劳动者公示的，不产生法律效力，解除行为违法。"
  - rule_id: "rule_006"
    explanation: "违法解除劳动合同应当按照经济补偿标准的二倍支付赔偿金。李某工作3.5年，经济补偿为3.5个月工资，赔偿金为7个月工资。"
legal_principles: 
  - "用人单位的规章制度必须经过民主程序制定并向劳动者公示或告知，否则不能作为解除劳动合同的依据"
  - "用人单位主张劳动者严重违纪的，应当对违纪事实的存在承担举证责任"
  - "违法解除劳动合同的赔偿金=劳动者在本单位工作年限×月平均工资×2倍"
relevance_score: 0.95
