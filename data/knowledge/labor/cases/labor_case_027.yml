case_id: "labor_case_027"
title: "韩某诉南京某银行产检假按事假处理纠纷案"
domain: "labor"
related_categories:
  - "pregnancy_protection"
  - "maternity_benefits"
source: "参考：南京市秦淮区人民法院（2022）苏0104民初5678号"
publish_date: "2022-12-15"
summary: "韩某于2019年3月入职南京某银行担任客户经理，月薪15,000元。2022年1月韩某怀孕后，按照医院建议定期进行产检。公司要求韩某每次产检按事假申请，扣减当日工资和全勤奖。韩某认为产检假属于法定权利，公司不得按事假处理，要求公司返还已扣工资并赔偿。"
facts: 
  - "韩某于2019年3月入职南京某银行，月薪15,000元（基本工资10,000元+绩效5,000元）"
  - "2022年1月韩某怀孕后，按照医院产检计划进行定期检查，每次产检半天至一天"
  - "公司要求韩某每次产检前填写事假申请单，按事假处理，扣除当日工资和当月全勤奖500元"
  - "截至2022年6月，韩某共进行产检7次，被扣工资合计3,448元（按日工资计算），全勤奖被扣2,000元"
  - "韩某向公司人事部门提出异议，称产检假应计入劳动时间，公司不予理睬"
dispute_focus: "女职工产前检查时间是否应计入劳动时间？用人单位按事假扣减工资是否合法"
judgment: "法院认定：根据《女职工劳动保护特别规定》第六条，女职工在孕期进行产前检查的时间计入劳动时间。产检时间按正常出勤对待，用人单位不得按事假、病假处理，不得扣减工资和全勤奖。判决公司退还韩某被扣工资3,448元及全勤奖2,000元，并赔偿韩某精神损害抚慰金3,000元。"
key_rules_applied: 
  - rule_id: "labor_rule_046"
    explanation: "女职工怀孕期间进行产前检查的时间应当计入劳动时间，用人单位应当按照正常出勤支付工资。"
  - rule_id: "labor_rule_048"
    explanation: "孕期女职工依法享有产前检查的权利，用人单位不得以任何理由限制或因此扣减工资待遇。"
legal_principles: 
  - "产前检查时间应计入劳动时间，按正常出勤对待"
  - "用人单位不得要求女职工将产检按事假、病假处理"
  - "因产检扣减工资和全勤奖的，用人单位应全额返还"
relevance_score: 0.89
