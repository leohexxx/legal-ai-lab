case_id: "labor_case_016"
title: "何某诉重庆某房地产公司经济补偿金计算争议案"
domain: "labor"
related_categories:
  - "severance_pay"
source: "参考：重庆市第五中级人民法院（2022）渝05民终6789号"
publish_date: "2022-09-05"
summary: "何某于2009年3月入职重庆某房地产公司，2022年5月双方协商一致解除劳动合同。公司计算的解除前12个月平均工资为6,500元，但何某主张应包含年终奖、季度奖和各项补贴，实际平均工资应为9,800元。公司拒绝按9,800元计算经济补偿，双方产生争议。"
facts: 
  - "何某于2009年3月15日入职重庆某房地产公司，2022年5月31日双方协商一致解除劳动合同"
  - "何某的月基本工资为6,500元，但每月还有通讯补贴300元、交通补贴500元、餐补400元"
  - "2021年12月公司发放2021年度年终奖40,000元，2022年3月发放季度奖12,000元"
  - "公司计算经济补偿时仅按基本工资6,500元计算，未包含补贴和奖金"
  - "何某工作年限为13年2个月，按13.5年计算"
dispute_focus: "经济补偿金计算中的'月平均工资'是否包含年终奖、季度奖和各项补贴"
judgment: "法院认定：根据《劳动合同法实施条例》第二十七条，经济补偿的月工资按照劳动者应得工资计算，包括计时工资、计件工资、奖金、津贴和补贴等货币性收入。年终奖、季度奖、各项补贴均属于工资的组成部分，应计入月平均工资。何某解除前12个月应得工资总额为117,600元（基本工资78,000元+通讯补贴3,600元+交通补贴6,000元+餐补4,800元+年终奖40,000元+季度奖12,000元），月均9,800元。判决公司支付经济补偿差额44,550元（（9,800元-6,500元）×13.5个月）。"
key_rules_applied: 
  - rule_id: "labor_rule_007"
    explanation: "经济补偿的月工资是指劳动者解除或终止前12个月的应得工资，包括计时/计件工资、奖金、津贴和补贴等，不限于基本工资。"
  - rule_id: "labor_rule_031"
    explanation: "工作年限超过12年的，经济补偿最多计算12年（2008年1月1日后），但2008年1月1日前的工龄按当时规定执行。"
legal_principles: 
  - "经济补偿的月平均工资包含基本工资、奖金、津贴、补贴等全部货币性收入"
  - "年终奖和季度奖应按年度/季度分摊后计入月平均工资"
  - "用人单位不得仅以基本工资为基数计算经济补偿"
