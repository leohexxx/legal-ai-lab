case_id: "labor_case_013"
title: "吴某诉天津某制造企业社保补缴争议案"
domain: "labor"
related_categories:
  - "social_insurance_payment"
source: "参考：天津市第一中级人民法院（2022）津01民终5678号"
publish_date: "2023-01-15"
summary: "吴某于2016年4月入职天津某制造企业，公司一直按最低缴费基数而非吴某实际工资缴纳社会保险，导致吴某养老保险和医疗保险待遇受损。2022年吴某离职后要求公司补缴社保差额，并赔偿因社保基数不足导致的医疗费损失。"
facts: 
  - "吴某于2016年4月入职天津某制造企业，月薪从入职时的6,000元逐步涨至离职前的12,000元"
  - "公司一直按天津市最低缴费基数（约3,500元）为吴某缴纳社保，而非按其实际工资"
  - "2021年12月吴某因病住院，因公司按最低基数缴纳医保，医保报销比例低于实际工资应享标准，吴某个人多承担医疗费约12,600元"
  - "吴某要求公司按实际工资补缴2016年4月至2022年3月期间的社保差额"
  - "公司以'行业惯例'为由拒绝，称很多企业都按最低基数缴纳"
dispute_focus: "用人单位长期按最低基数而非实际工资缴纳社会保险，劳动者是否有权要求补缴并赔偿损失"
judgment: "法院认定：用人单位应当以劳动者实际工资为基数足额缴纳社会保险，不得以行业惯例为由规避法定义务。判决公司为吴某补缴2016年4月至2022年3月期间社保差额，具体金额由社保经办机构核定；公司赔偿吴某因缴费基数不足导致的医疗费损失12,600元。"
key_rules_applied: 
  - rule_id: "labor_rule_014"
    explanation: "用人单位应当以劳动者实际工资收入为基数，按照规定的比例缴纳社会保险费，不得擅自降低缴费基数。"
  - rule_id: "rule_003"
    explanation: "工资包括计时工资、计件工资、奖金、津贴和补贴等，用人单位应以全部工资作为社保缴费基数。'行业惯例'不是规避法定义务的合法理由。"
legal_principles: 
  - "用人单位应当以劳动者实际工资为基数足额缴纳社会保险，不得按最低基数缴纳"
  - "因社保缴费基数不足导致劳动者待遇受损的，用人单位应承担赔偿责任"
  - "'行业惯例'不能成为规避法定义务的理由"
relevance_score: 0.9
