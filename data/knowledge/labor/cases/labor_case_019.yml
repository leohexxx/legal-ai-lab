case_id: "labor_case_019"
title: "谢某诉长沙某物流公司上下班途中工伤认定案"
domain: "labor"
related_categories:
  - "injury_identification"
source: "参考：长沙市中级人民法院（2022）湘01行终567号"
publish_date: "2022-06-15"
summary: "谢某系长沙某物流公司员工，2021年11月某日23时50分下夜班后骑电动车回家途中，被一辆闯红灯的轿车撞伤，导致左腿骨折，交警认定轿车全责。谢某申请工伤认定，公司以'下班时间与回家路线不合理'为由否认属于工伤，人社局初次认定非工伤，谢某提起行政诉讼。"
facts: 
  - "谢某于2020年3月入职长沙某物流公司，担任仓库管理员，工作时间19:00至23:30"
  - "2021年11月15日23时50分（实际打卡下班时间为23:45），谢某骑电动车回家"
  - "谢某在回家必经路段某十字路口被一辆闯红灯的轿车撞伤，交警认定轿车全责"
  - "医院诊断：左股骨骨折，住院治疗45天，医疗费共计8.7万元"
  - "公司主张：谢某下班时间应为23:30，其23:45才打卡离开属于'不合理延迟'；且回家路线非日常最短路线"
  - "人社局初核以'非合理时间、非合理路线'为由不予认定工伤"
dispute_focus: "劳动者在上下班途中发生非本人主要责任交通事故，如何认定'合理时间'和'合理路线'"
judgment: "法院审理后认为：谢某23:45打卡离开属于合理的时间偏差（15分钟属合理范围），无需苛责精确到分钟；企业未提供指定住所地，谢某选择的日常居住路线属于合理路线。撤销人社局不予认定工伤的决定，判决人社局应当在判决生效后30日内重新作出工伤认定决定。重核后人社局认定谢某构成工伤。"
key_rules_applied: 
  - rule_id: "labor_rule_017"
    explanation: "在上下班途中，受到非本人主要责任的交通事故伤害的，应当认定为工伤。'上下班途中'包括合理时间内的合理路线。"
  - rule_id: "rule_003"
    explanation: "对于'合理时间'和'合理路线'应从宽把握，小范围内的路线或时间偏差不应影响工伤认定。"
legal_principles: 
  - "上下班途中的工伤认定应从宽把握合理时间和合理路线"
  - "下班后合理的时间偏差（如打卡后离厂、短暂停留等）不改变下班途中的性质"
  - "劳动者选择的不限于最短路线，只要在合理的日常通勤范围内即属合理路线"
relevance_score: 0.92
