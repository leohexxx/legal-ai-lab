case_id: "labor_case_010"
title: "杨某诉北京某外卖平台骑手劳动关系确认案"
domain: "labor"
related_categories:
  - "de_facto_relation"
source: "参考：北京市朝阳区人民法院（2023）京0105民初6789号"
publish_date: "2023-04-12"
summary: "杨某于2022年5月注册成为北京某外卖平台的骑手，通过平台APP接单配送。2022年8月杨某在配送途中发生交通事故受伤，因平台不承认劳动关系导致无法申报工伤认定。杨某申请仲裁要求确认与平台之间存在劳动关系。"
facts: 
  - "杨某于2022年5月通过手机APP注册成为某外卖平台骑手，未签订书面劳动合同"
  - "杨某需按平台规定的时间通过APP打卡签到，穿着平台统一工服，使用平台提供的配送箱"
  - "平台通过系统自动派单，杨某不能自由选择或拒绝订单，拒绝订单会被扣减积分"
  - "杨某的配送费标准由平台制定，按单结算，平台每月从配送费中扣除管理费和保险费"
  - "2022年8月15日杨某在配送途中被机动车撞伤，住院治疗30天，医疗费约6.8万元"
dispute_focus: "外卖骑手与平台之间是否构成事实劳动关系，判断标准是什么"
judgment: "法院认定：虽然杨某与平台未签订书面劳动合同，但杨某接受平台的管理（打卡、统一着装、系统派单），工作安排受平台控制，配送费由平台定价和发放，双方之间符合事实劳动关系的特征。判决确认杨某与平台之间自2022年5月起存在劳动关系，平台需配合杨某办理工伤认定手续。"
key_rules_applied: 
  - rule_id: "labor_rule_025"
    explanation: "事实劳动关系的认定需综合考量劳动者是否接受用人单位的管理、是否从事用人单位安排的有报酬劳动、是否使用用人单位提供的劳动工具等因素。"
  - rule_id: "labor_rule_026"
    explanation: "新就业形态下，平台企业对劳动者进行实质性管理、控制较强时，即使未签书面合同也应认定存在劳动关系。"
legal_principles: 
  - "事实劳动关系不以书面合同为唯一认定标准，需综合考量管理控制程度"
  - "平台经济下的用工关系，应当穿透表面的合作协议形式，审查实质的管理控制关系"
  - "骑手穿着平台工服、受平台派单管理、平台定价结算等是认定劳动关系的重要因素"
relevance_score: 0.92
