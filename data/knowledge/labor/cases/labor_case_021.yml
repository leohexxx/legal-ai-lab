case_id: "labor_case_021"
title: "夏某诉安徽某矿业公司工亡家属赔偿案"
domain: "labor"
related_categories:
  - "death_compensation"
source: "参考：安徽省高级人民法院（2022）皖民再12号"
publish_date: "2022-10-25"
summary: "夏某的丈夫陈某在安徽某矿业公司井下作业时因瓦斯爆炸事故死亡，被认定为工亡。陈某生前月薪8,500元，家中有年迈父母（父67岁、母65岁）和一名8岁女儿。公司仅支付了丧葬费，对一次性工亡补助金和供养亲属抚恤金的计算标准存在争议。夏某代表家属提起诉讼。"
facts: 
  - "陈某于2010年6月入职安徽某矿业公司担任井下采掘工，月薪8,500元"
  - "2021年12月10日陈某在井下作业时因瓦斯爆炸事故死亡，经认定为工亡"
  - "陈某家属包括：妻子夏某（35岁，无业）、父亲陈某国（67岁，无收入）、母亲李某（65岁，无收入）、女儿陈某某（8岁）"
  - "公司已支付丧葬补助金38,000元（6个月统筹地区上年度职工月平均工资）"
  - "公司主张一次性工亡补助金按2020年全国城镇居民人均可支配收入（43,834元）的20倍计算"
  - "双方就适用年度标准、供养亲属范围及抚恤金计算方式产生争议"
dispute_focus: "一次性工亡补助金的标准应按事故发生年度还是赔付年度计算？供养亲属抚恤金的适用范围和计算方式如何确定"
judgment: "法院认定：一次性工亡补助金标准应按事故发生时间确定，即2021年度全国城镇居民人均可支配收入（47,412元）的20倍，共计948,240元。供养亲属抚恤金方面，陈某父母均达到法定退休年龄且无固定收入，女儿未成年，均符合领取条件。按职工本人工资的40%（配偶每月）、30%（父母每人每月）、30%（子女每月），合计核定为陈某生前工资的130%，超出100%上限的按100%计算。判决公司（工伤保险基金）支付一次性工亡补助金948,240元，以及按月支付供养亲属抚恤金合计8,500元/月。"
key_rules_applied: 
  - rule_id: "labor_rule_037"
    explanation: "一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的20倍，适用事故发生时上一年度的数据。"
  - rule_id: "labor_rule_038"
    explanation: "供养亲属抚恤金按职工本人工资的一定比例发给无劳动能力或无生活来源的亲属，配偶每月40%、其他亲属每人每月30%，总额不超过本人工资。"
legal_principles: 
  - "一次性工亡补助金按事故发生时上一年度全国城镇居民人均可支配收入的20倍计算"
  - "供养亲属抚恤金的领取范围包括父母（达到退休年龄且无收入）、未成年子女等"
  - "多项供养亲属抚恤金总额不超过工亡职工本人工资"
relevance_score: 0.93
