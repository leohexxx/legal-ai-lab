case_id: "labor_case_025"
title: "罗某诉北京某互联网公司竞业限制范围过宽无效案"
domain: "labor"
related_categories:
  - "non_compete_agreement"
source: "参考：北京知识产权法院（2023）京73民终1234号"
publish_date: "2023-08-20"
summary: "罗某于2021年7月入职北京某互联网大厂担任产品运营经理，签订了竞业限制协议，限制范围为'所有互联网及相关行业企业'，覆盖全国。2022年10月罗某离职后入职一家小型教育科技公司（非互联网公司），原公司以违反竞业限制为由起诉要求罗某支付违约金80万元。"
facts: 
  - "罗某于2021年7月入职北京某互联网公司担任产品运营经理，月薪22,000元"
  - "竞业限制协议约定：竞业限制期1年，限制范围为'与公司存在竞争关系的所有互联网及相关行业企业'，地域为'中华人民共和国境内'"
  - "竞业限制补偿金为5,000元/月，协议未约定罗某的具体岗位限制范围"
  - "2022年10月罗某因个人原因离职，入职某小型教育科技公司做运营工作"
  - "原公司认为教育科技公司也涉及线上业务，属于'互联网及相关行业'，起诉要求罗某支付违约金80万元"
  - "罗某抗辩称限制范围过于宽泛，且新公司不与其原公司存在实质性竞争关系"
dispute_focus: "竞业限制范围约定过于宽泛（'所有互联网及相关行业'）是否有效？如何认定'竞争关系'"
judgment: "法院认定：（1）'所有互联网及相关行业'的限制范围过于宽泛，互联网行业边界模糊、包罗万象，将限制范围扩大到与公司不存在实质性竞争关系的企业，超出了保护用人单位商业秘密的必要限度；（2）教育科技公司的主营业务为在线教育，与原公司的主营业务（社交平台）不存在实质性竞争关系；（3）竞业限制范围过宽的部分无效，但对合理部分不产生影响。判决驳回原公司的诉讼请求，竞业限制协议中'所有互联网及相关行业'的约定因范围过宽而对罗某不具有约束力。"
key_rules_applied: 
  - rule_id: "labor_rule_042"
    explanation: "竞业限制的范围应当限于与本单位生产或经营同类产品、从事同类业务的有竞争关系的其他用人单位，不得过度扩大。"
  - rule_id: "labor_rule_043"
    explanation: "竞业限制范围、地域、期限超出合理限度的，人民法院可以根据实际情况下调或认定相应条款无效。"
legal_principles: 
  - "竞业限制的范围不应超过保护用人单位商业秘密的必要限度"
  - "'互联网及相关行业'等过度宽泛的限制条款可能被认定无效"
  - "竞争关系的认定应审查双方主营业务是否存在实质性竞争，而非简单以行业分类判断"
relevance_score: 0.91
