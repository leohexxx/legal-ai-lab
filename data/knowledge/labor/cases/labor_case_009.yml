case_id: "labor_case_009"
title: "马某诉成都某餐饮公司最低工资保障纠纷案"
domain: "labor"
related_categories:
  - "minimum_wage"
source: "参考：成都市劳动仲裁委（2022）成劳仲字第456号"
publish_date: "2022-10-08"
summary: "马某于2022年3月入职成都某餐饮公司担任服务员，月薪约定'底薪1,500元+提成'。2022年3月至7月，马某因业绩不佳每月实发工资在1,600元至1,850元之间，均低于成都市2022年最低工资标准2,100元/月。马某提出异议后公司称'底薪加提成制，多劳多得'，拒绝补足差额。"
facts: 
  - "马某于2022年3月5日入职成都某餐饮公司担任服务员，月薪结构为底薪1,500元加业绩提成"
  - "2022年成都市月最低工资标准为2,100元/月"
  - "3月至7月马某每月实发工资分别为1,600元、1,720元、1,830元、1,650元、1,850元，均低于当地最低工资标准"
  - "马某要求公司补足差额，公司以'底薪加提成制，多劳多得'为由拒绝"
  - "马某每日工作8小时，每周工作6天，不存在旷工或请假情况"
dispute_focus: "实行底薪加提成工资制的劳动者，当月提成较低导致实发工资低于最低工资标准的，用人单位是否应补足差额"
judgment: "仲裁委裁决：最低工资保障制度适用于所有建立劳动关系的劳动者，工资结构不影响最低工资的适用。公司应当补足马某2022年3月至7月期间工资低于最低工资标准的差额共计2,770元。同时责令公司今后确保劳动者实发工资不低于当地最低工资标准，否则将面临行政处罚。"
key_rules_applied: 
  - rule_id: "labor_rule_012"
    explanation: "实行计件工资或提成工资的劳动者，其实际收入不得低于当地最低工资标准。低于标准的，用人单位应当补足差额。"
  - rule_id: "rule_017"
    explanation: "最低工资标准是劳动者在法定工作时间内提供正常劳动的前提下，用人单位应支付的最低劳动报酬。任何工资制度下均不得低于此标准。"
legal_principles: 
  - "最低工资保障制度适用于所有劳动关系的劳动者，不受工资结构影响"
  - "实行底薪+提成工资制的，当月实际发放工资低于最低工资标准时，用人单位应当补足差额"
  - "最低工资标准每两年至少调整一次，用人单位应关注当地标准的更新"
relevance_score: 0.9
