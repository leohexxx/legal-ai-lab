case_id: "labor_case_014"
title: "郑某诉南京某软件公司住房公积金缴存纠纷案"
domain: "labor"
related_categories:
  - "housing_fund"
source: "参考：南京市玄武区人民法院（2022）苏0102民初3456号"
publish_date: "2022-11-28"
summary: "郑某于2019年8月入职南京某软件公司，月薪20,000元。公司以'公积金不是法定强制缴纳'为由，一直未为郑某开立住房公积金账户。郑某在南京购房需要办理公积金贷款，因公司未缴存公积金导致无法申请低利率公积金贷款，只能申请商业贷款，利息差额约15.6万元。郑某要求公司补缴并赔偿损失。"
facts: 
  - "郑某于2019年8月1日入职南京某软件公司，月薪20,000元，劳动合同约定了五险一金"
  - "公司为郑某缴纳了五险，但从未缴纳住房公积金，称'公积金不是强制性的'"
  - "2022年5月郑某在南京购买首套住房，因公司未缴公积金无法申请公积金贷款（利率3.25%）"
  - "郑某只能申请商业贷款（利率4.9%），贷款金额120万元，30年期利息差额约15.6万元"
  - "郑某要求公司补缴2019年8月起的住房公积金，并赔偿因无法使用公积金贷款造成的利息损失"
dispute_focus: "用人单位未依法为劳动者缴存住房公积金，是否应赔偿劳动者因此产生的贷款利息损失"
judgment: "法院认定：根据《住房公积金管理条例》，用人单位为职工缴存住房公积金是法定义务，合同中约定'五险一金'公司只缴五险构成违约。判决公司为郑某补缴2019年8月至2022年5月期间的住房公积金，个人和单位部分均由公司承担（因公司过错导致逾期缴存）。同时赔偿郑某因无法申请公积金贷款导致的利息损失120,000元（酌情按实际损失80%计算）。"
key_rules_applied: 
  - rule_id: "labor_rule_015"
    explanation: "用人单位应当自录用之日起30日内为劳动者办理住房公积金缴存登记并设立账户，逾期不办理的，劳动者可向公积金管理中心投诉。"
  - rule_id: "rule_001"
    explanation: "住房公积金属广义劳动报酬范畴，用人单位依法负有为劳动者缴存的义务。"
legal_principles: 
  - "住房公积金的缴存是用人单位的法定义务，并非企业可选项目"
  - "用人单位未依法缴存公积金导致劳动者损失的，应当承担赔偿责任"
  - "劳动合同约定'五险一金'而用人单位仅缴五险的，构成违约"
relevance_score: 0.87
