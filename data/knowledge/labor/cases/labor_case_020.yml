case_id: "labor_case_020"
title: "唐某诉浙江某机械公司工伤伤残赔偿级别争议案"
domain: "labor"
related_categories:
  - "disability_grade"
  - "lump_sum_compensation"
source: "参考：浙江省宁波市中级人民法院（2023）浙02民终3456号"
publish_date: "2023-03-10"
summary: "唐某在浙江某机械公司工作期间右手被机器压伤，经治疗后被鉴定为七级伤残。公司对伤残等级提出异议，要求重新鉴定，并以唐某已获得工伤保险赔付为由拒绝支付一次性就业补助金和停工留薪期工资差额。唐某诉至法院要求公司支付各项工伤待遇差额合计约15.8万元。"
facts: 
  - "唐某于2019年7月入职浙江某机械公司担任操作工，月薪6,500元，公司为其缴纳了工伤保险"
  - "2021年9月5日唐某在操作机器时右手被压伤，诊断为右手多发性骨折、神经损伤"
  - "经劳动能力鉴定委员会鉴定为七级伤残，唐某治疗终结"
  - "工伤保险基金支付了医疗费和一次性伤残补助金（13个月本人工资）"
  - "公司以'对伤残等级有异议'为由拒绝支付一次性伤残就业补助金（25个月社平工资）"
  - "公司还拒绝支付唐某6个月的停工留薪期工资差额，称已按基本工资支付"
dispute_focus: "用人单位对官方伤残等级鉴定结论有异议是否可以拒绝支付法定的工伤待遇项目"
judgment: "法院认定：劳动能力鉴定委员会的伤残等级鉴定结论具有法律效力，公司虽有异议但未依法申请复核或重新鉴定，不能以口头异议为由拒绝履行义务。判决公司支付：（1）一次性伤残就业补助金178,400元（浙江省2022年社平工资7,136元/月×25个月）；（2）停工留薪期工资差额19,500元（6,500元/月×6个月-已支付19,500元中的差额）。"
key_rules_applied: 
  - rule_id: "labor_rule_035"
    explanation: "七级至十级伤残的，劳动、聘用合同期满终止或职工提出解除合同的，由用人单位支付一次性伤残就业补助金，标准按各省规定执行。"
  - rule_id: "labor_rule_036"
    explanation: "停工留薪期内，原工资福利待遇不变，由用人单位按月支付，不得仅按基本工资支付。停工留薪期由劳动能力鉴定委员会确认。"
legal_principles: 
  - "劳动能力鉴定结论具有法律效力，用人单位不得以口头异议为由拒绝履行工伤待遇支付义务"
  - "停工留薪期工资按原工资福利待遇计算，包括基本工资、奖金、津贴等"
  - "对伤残等级有异议应通过法定复核程序解决，不得擅自扣减待遇"
relevance_score: 0.91
