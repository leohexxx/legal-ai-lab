case_id: "labor_case_007"
title: "孙某诉北京某广告公司加班费争议案"
domain: "labor"
related_categories:
  - "overtime"
source: "参考：北京市第二中级人民法院（2022）京02民终8765号"
publish_date: "2022-12-10"
summary: "孙某于2020年6月入职北京某广告公司担任客户经理，月薪15,000元。在职期间孙某经常加班，工作日加班累计286小时，休息日加班累计432小时，法定节假日加班64小时，公司未支付任何加班费。孙某离职后申请仲裁要求公司支付加班费共计108,720元。"
facts: 
  - "孙某于2020年6月1日入职北京某广告公司，月薪15,000元，合同约定标准工时制"
  - "孙某提交了考勤记录、加班审批单和微信工作群聊天记录，证明工作日加班286小时、休息日加班432小时、法定节假日加班64小时"
  - "公司主张孙某岗位实行'不定时工作制'，但未能提供劳动行政部门的审批文件"
  - "公司称加班系孙某自愿行为，但微信记录显示加班均系公司领导安排"
  - "孙某离职前12个月平均工资为15,800元"
dispute_focus: "用人单位未取得不定时工作制审批却主张实行不定时工作制，是否应支付加班费"
judgment: "仲裁委和法院认定：公司未取得不定时工作制审批文件，应按标准工时制处理。孙某提供的考勤记录和微信记录足以证明加班事实。判决公司支付延时加班费26,013元（15,800÷21.75÷8×286×150%）、休息日加班费94,262元（15,800÷21.75÷8×432×200%）、法定节假日加班费17,455元（15,800÷21.75÷8×64×300%），合计137,730元。"
key_rules_applied: 
  - rule_id: "labor_rule_011"
    explanation: "用人单位安排劳动者延长工作时间的，应支付不低于工资150%的加班费；休息日工作又不能补休的，支付200%；法定节假日工作的，支付300%。"
  - rule_id: "rule_014"
    explanation: "加班费争议中，劳动者有证据证明用人单位掌握加班事实相关证据的，用人单位应当提供，不提供的承担不利后果。"
legal_principles: 
  - "实行不定时工作制须经劳动行政部门审批，未经审批不得以不定时工作制为由拒付加班费"
  - "加班事实的举证责任由劳动者承担，但劳动者可提交考勤记录、微信记录等证据"
  - "法定节假日加班不得以补休代替加班费，必须支付300%的工资报酬"
relevance_score: 0.93
