case_id: "labor_case_001"
title: "王某诉上海某网络科技有限公司未签订劳动合同双倍工资案"
domain: "labor"
related_categories:
  - "contract_conclusion"
source: "参考：上海市第一中级人民法院（2022）沪01民终12345号"
publish_date: "2022-08-15"
summary: "王某于2021年3月入职上海某网络科技公司，月薪12,000元，公司一直未与其签订书面劳动合同。2022年1月王某离职后申请劳动仲裁，要求公司支付未签订劳动合同的双倍工资差额。仲裁委裁决公司支付11个月双倍工资差额共计132,000元，公司不服起诉至法院。"
facts: 
  - "王某于2021年3月1日入职上海某网络科技公司，从事前端开发工作，月薪12,000元"
  - "公司未与王某签订书面劳动合同，但每月按时通过银行转账发放工资12,000元"
  - "2022年1月15日王某以公司未缴纳社保为由提出解除劳动关系并离职"
  - "王某于2022年2月向上海市某区劳动仲裁委申请仲裁，要求支付2021年4月至2022年1月共11个月的双倍工资差额132,000元"
  - "公司辩称王某属于外包人员，与第三方公司存在劳动关系，但未能提供任何外包协议"
dispute_focus: "用人单位超过一个月未与劳动者签订书面劳动合同，是否应当支付双倍工资差额"
judgment: "一审法院认定王某与公司自2021年3月1日起存在事实劳动关系，公司未与王某签订书面劳动合同违反《劳动合同法》第十条规定，依据第八十二条判决公司支付2021年4月1日至2022年1月31日期间双倍工资差额共计132,000元。公司上诉后二审维持原判。"
key_rules_applied: 
  - rule_id: "labor_rule_001"
    explanation: "用人单位自用工之日起超过一个月不满一年未与劳动者订立���面劳动合同的，应当向劳动者每月支付二倍的工资。王某入职后11个月未签合同，应获双倍工资差额。"
  - rule_id: "rule_004"
    explanation: "未签劳动合同二倍工资规则适用于存在事实劳动关系但未签订书面合同的情形，计算期间为用工满一个月的次日至满一年的前一日。"
legal_principles: 
  - "用人单位自用工之日起即与劳动者建立劳动关系，应当在一个月内订立书面劳动合同"
  - "用人单位超过一个月未与劳动者签订书面劳动合同的，应当向劳动者每月支付二倍工资，最长不超过11个月"
  - "用人单位主张劳动者不属于本单位员工的，应当承担举证责任"
relevance_score: 0.95
