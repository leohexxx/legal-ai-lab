case_id: "labor_case_006"
title: "刘某诉苏州某制造企业拖欠工资劳动监察与仲裁案"
domain: "labor"
related_categories:
  - "salary_arrears"
source: "参考：江苏省苏州市吴江区劳动仲裁委（2023）吴江劳仲字第189号"
publish_date: "2023-06-20"
summary: "刘某等32名工人为苏州某制造企业员工，2022年10月至2023年3月期间公司以'经营困难'为由连续拖欠6个月工资，累计欠薪总额达187万元。刘某等人多次催要无果后，向劳动监察部门投诉并申请劳动仲裁，要求公司支付拖欠工资及加付赔偿金。"
facts: 
  - "刘某等32名工人于不同时间入职苏州某制造企业，月薪在4,000元至12,000元不等"
  - "公司自2022年10月起以'经营困难、资金周转不灵'为由开始拖欠工资"
  - "截至2023年3月，公司累计拖欠6个月工资，总额达1,872,500元，其中刘某个人被欠薪52,000元"
  - "刘某等人多次向公司法定代表人催讨，公司出具了欠条但一直未支付"
  - "2023年4月刘某等人向当地劳动监察大队投诉，同时申请劳动仲裁"
dispute_focus: "用人单位以经营困难为由长期拖欠工资，劳动者能否同时通过劳动监察投诉和劳动仲裁追索欠薪及加付赔偿金"
judgment: "劳动监察部门向公司下达《责令改正通知书》，公司逾期仍未支付。劳动仲裁委裁决公司一次性支付32名工人全部拖欠工资1,872,500元，并按《劳动合同法》第八十五条规定加付50%的赔偿金936,250元。公司未起诉，并最终通过资产处置支付了全部款项。"
key_rules_applied: 
  - rule_id: "rule_001"
    explanation: "工资应当以货币形式按月足额支付，用人单位不得克扣或无故拖欠。公司以经营困难为由拖欠6个月工资，严重违反工资支付规定。"
  - rule_id: "rule_007"
    explanation: "用人单位拖欠劳动报酬的，劳动行政部门责令限期支付，逾期不支付的，责令按应付金额50%至100%加付赔偿金。"
legal_principles: 
  - "工资应当按时足额支付，经营困难不能成为长期拖欠工资的合法理由"
  - "用人单位拖欠工资的，劳动者可同时向劳动监察投诉和申请劳动仲裁"
  - "用人单位拖欠工资经责令后仍不支付的，应当加付50%至100%的赔偿金"
relevance_score: 0.94
