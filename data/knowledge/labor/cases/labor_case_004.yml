case_id: "labor_case_004"
title: "陈某诉深圳某互联网公司试用期违法解除劳动合同案"
domain: "labor"
related_categories:
  - "probation_dispute"
  - "illegal_termination"
source: "参考：深圳市中级人民法院（2022）粤03民终6543号"
publish_date: "2022-09-18"
summary: "陈某于2022年3月入职深圳某互联网公司，担任产品经理，劳动合同约定试用期6个月。2022年5月，公司在试用期届满前以'不符合录用条件'为由解除劳动合同，但未能提供明确的录用条件标准和考核依据。陈某申请仲裁要求恢复劳动关系或支付违法解除赔偿金。"
facts: 
  - "陈某于2022年3月1日入职深圳某互联网公司，月薪25,000元，劳动合同期限3年，试用期6个月"
  - "2022年5月20日公司向陈某发出《试用期解除劳动合同通知书》，理由为'不符合录用条件'"
  - "公司未向陈某提供书面的录用条件说明或岗位职责说明书，也未进行正式的试用期考核"
  - "公司仅提供了部门主管的口头评价，称陈某'工作能力不足、沟通效率低'，但无客观证据"
  - "陈某在解除前正常工作，无迟到早退等违纪行为"
dispute_focus: "用人单位在试用期以'不符合录用条件'为由解除劳动合同，但未明确告知录用条件且无考核依据的，解除是否合法"
judgment: "法院认定公司在试用期解除劳动合同缺乏依据，未提供明确的录用条件标准，未进行正式考核，仅凭主观评价不能证明陈某不符合录用条件。判决公司支付违法解除赔偿金25,000元（0.5个月工资×2倍），并承担诉讼费用。同时认定由于双方信任关系已破裂，不支持恢复劳动关系。"
key_rules_applied: 
  - rule_id: "labor_rule_022"
    explanation: "试用期解除劳动合同，用人单位需证明劳动者'不符合录用条件'，录用条件必须在入职时明确告知并有客观考核标准。"
  - rule_id: "labor_rule_006"
    explanation: "违法解除劳动合同应当支付赔偿金。陈某工作不满6个月，按0.5年计算经济补偿，赔偿金为1个月工资。"
legal_principles: 
  - "用人单位在试用期解除劳动合同的，应当向劳动者说明理由，并证明劳动者不符合录用条件"
  - "录用条件应当明确、具体，并在劳动者入职时书面告知"
  - "仅凭主观评价而无客观考核依据，不能认定劳动者不符合录用条件"
relevance_score: 0.92
