case_id: "labor_case_017"
title: "秦某诉武汉某科技公司经济性裁员未通知工会案"
domain: "labor"
related_categories:
  - "layoff_procedure"
  - "illegal_termination"
source: "参考：武汉市中级人民法院（2023）鄂01民终2345号"
publish_date: "2023-06-30"
summary: "秦某于2018年2月入职武汉某科技公司，2022年8月公司以'经营困难'为由进行经济性裁员，一次性裁减员工23人（占员工总数约18%）。公司向秦某支付了经济补偿但未提前30日向工会或全体职工说明情况，也未将裁减人员方案向劳动行政部门报告。秦某认为裁员程序违法，要求支付违法解除赔偿金。"
facts: 
  - "秦某于2018年2月入职武汉某科技公司，月薪11,000元"
  - "2022年8月公司以'经营严重困难'为由实施经济性裁员，一次性裁减23人"
  - "公司裁减人数占员工总数（128人）的18%，超过法定10%的比例"
  - "公司未提前30日向工会或全体职工说明情况，也未听取工会或职工意见"
  - "公司的裁减人员方案未向当地劳动行政部门报告"
  - "公司向秦某支付了经济补偿49,500元（11,000元/月×4.5个月），但秦某认为程序违法"
dispute_focus: "经济性裁员未履行提前说明情况和向劳动行政部门报告等法定程序，是否构成违法解除"
judgment: "法院认定：公司裁员符合'经营严重困难'的实体条件，但未履行经济性裁员的法定程序，包括提前30日向工会或职工说明情况、听取意见、将裁减方案向劳动行政部门报告。尽管公司已支付经济补偿，但因程序严重违法，裁员行为构成违法解除。判决公司在前述经济补偿差额基础上支付违法解除赔偿金49,500元（即2N减去已支付的N=4.5个月工资）。"
key_rules_applied: 
  - rule_id: "labor_rule_008"
    explanation: "经济性裁员需要裁减人员20人以上或占职工总数10%以上的，应提前30日向工会或全体职工说明情况，并听取意见，且将裁减方案向劳动行政部门报告。"
  - rule_id: "labor_rule_006"
    explanation: "经济性裁员未履行法定程序的，构成违法解除劳动合同，应支付2倍经济补偿的赔偿金。"
legal_principles: 
  - "经济性裁员有严格的实体条件和程序要求，缺一不可"
  - "裁减20人以上或占职工总数10%以上的，必须履行提前说明、听取意见和报告程序"
  - "程序违法的经济性裁员构成违法解除，应支付2N赔偿金"
relevance_score: 0.93
