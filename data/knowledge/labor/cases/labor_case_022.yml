case_id: "labor_case_022"
title: "金某诉西安某设计公司带薪年休假未休补偿案"
domain: "labor"
related_categories:
  - "annual_leave"
source: "参考：西安市中级人民法院（2023）陕01民终5678号"
publish_date: "2023-04-18"
summary: "金某于2015年6月入职西安某设计公司，累计工作年限12年，每年应享有10天带薪年休假。2020年至2022年期间，公司以'项目多、人手少'为由安排金某加班未安排年休假，也未支付未休年休假工资报酬。金某离职后要求公司支付3年未休年休假的工资报酬共计49,655元。"
facts: 
  - "金某于2015年6月入职西安某设计公司，月薪12,000元，累计工作年限12年"
  - "根据《职工带薪年休假条例》，金某每年应享受10天带薪年休假"
  - "2020年至2022年三年期间，公司以项目紧张为由未安排金某休年休假，金某也未主动提出休假"
  - "金某离职前12个月平均工资为13,500元（含奖金和加班费）"
  - "公司主张金某未主动申请休假视为自动放弃，且已支付的工资中已包含年休假补偿"
dispute_focus: "劳动者未主动申请年休假是否视为自动放弃？用人单位未安排年休假应如何计算补偿"
judgment: "法院认定：安排年休假是用人单位的法定义务，非劳动者主动申请的义务。公司未举证证明曾安排金某休假而金某书面放弃，应当视为公司未安排休假。未休年休假工资报酬按日工资的300%计算（含已付的100%工资，另支付200%）。金某日工资为（13,500元÷21.75天）=620.69元。判决公司支付2020年至2022年共30天未休年假工资报酬合计37,241元（620.69元×30天×200%）。"
key_rules_applied: 
  - rule_id: "labor_rule_019"
    explanation: "劳动者累计工作已满10年不满20年的，年休假10天。用人单位未安排年休假的，应当按照日工资收入的300%支付未休年休假工资报酬。"
  - rule_id: "rule_003"
    explanation: "未休年休假工资中的300%包含正常工资（100%）和额外补偿（200%）。劳动者未主动申请休年假不视为放弃。"
legal_principles: 
  - "安排年休假是用人单位的法定义务，不能以劳动者未申请为由免除"
  - "劳动者书面同意放弃年休假的，用人单位可只支付正常工资（无需额外补偿），但需有书面证据"
  - "未休年休假工资报酬为日工资的300%，其中100%是正常工资，200%是额外补偿"
relevance_score: 0.9
