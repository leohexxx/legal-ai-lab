case_id: "labor_case_012"
title: "林某诉深圳某超市非全日制用工加班费争议案"
domain: "labor"
related_categories:
  - "part_time"
  - "overtime"
source: "参考：深圳市劳动仲裁委（2022）深劳仲字第789号"
publish_date: "2022-08-30"
summary: "林某于2021年9月被深圳某超市以'非全日制用工'名义聘用为理货员，约定每小时工资22元，每天工作4小时。但实际上林某经常被要求每天工作7-8小时，每周工作6天，超出非全日制用工的法定工时限制。林某要求确认其与超市之间存在全日制劳动关系并补足工资差额。"
facts: 
  - "林某于2021年9月入职深圳某超市，签订非全日制用工协议，约定每小时22元，每天不超过4小时"
  - "实际上超市经常安排林某每天工作7至8小时，每周工作6天，平均每周工作约45小时"
  - "林某在2021年9月至2022年6月期间，平均每月工作时长超过180小时"
  - "超市未与林某签订全日制劳动合同，也未缴纳社会保险"
  - "深圳市2022年最低工资标准为2,360元/月，非全日制用工小时最低工资为23.7元"
dispute_focus: "用人单位以非全日制用工名义安排劳动者实际从事全日制工作的，是否应按全日制劳动关系处理"
judgment: "仲裁委认定：林某实际工作时长远超非全日制用工的法定限制（每日不超过4小时、每周不超过24小时），超市与林某之间名为'非全日制'实为全日制劳动关系。裁决确认双方自2021年9月起存在全日制劳动关系，超市与林某补签书面劳动合同，按深圳市最低工资标准补足工资差额共计23,520元，并为林某补缴社会保险。"
key_rules_applied: 
  - rule_id: "labor_rule_029"
    explanation: "非全日制用工劳动者平均每日工作时间不超过4小时，每周累计不超过24小时。超出该标准的，应认定为全日制劳动关系。"
  - rule_id: "rule_003"
    explanation: "低于最低工资标准支付工资的，用人单位应当补足差额。非全日制用工小时工资不得低于当地小时最低工资标准。"
legal_principles: 
  - "非全日制用工有严格的工时限制，超出法定标准应认定为全日制劳动关系"
  - "用人单位不得以非全日制用工为名规避签订书面劳动合同和缴纳社会保险的义务"
  - "非全日制用工的小时工资标准不得低于当地最低小时工资标准"
relevance_score: 0.89
