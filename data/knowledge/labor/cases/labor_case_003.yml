case_id: "labor_case_003"
title: "张某诉广州某贸易公司劳动合同期满终止未续签案"
domain: "labor"
related_categories:
  - "contract_renewal"
  - "contract_expiration"
source: "参考：广州市中级人民法院（2022）粤01民终9876号"
publish_date: "2022-11-05"
summary: "张某于2018年1月与广州某贸易公司签订三年固定期限劳动合同，2021年1月合同到期后，公司未与张某续签书面合同，但张某继续在原岗位工作至2022年6月。张某提出离职后要求公司支付未签订劳动合同的双倍工资差额及合同期满终止的经济补偿。"
facts: 
  - "张某于2018年1月1日入职广州某贸易公司，签订三年固定期限劳动合同，月薪8,000元，合同期限至2020年12月31日"
  - "合同到期后公司未与张某续签书面合同，但张某继续在原岗位工作，公司照常发放工资"
  - "2022年6月张某向公司提出辞职，同时要求支付未续签合同的双倍工资差额及终止合同的经济补偿"
  - "公司认为合同到期后双方已形成事实劳动关系，但拒绝支付双倍工资差额"
  - "张某工作年限从2018年1月计算至2022年6月共4年6个月"
dispute_focus: "固定期限劳动合同期满后劳动者继续工作但未续签书面合同，用人单位是否应当支付双倍工资差额"
judgment: "法院认为，合同到期后张某继续工作，公司未表示异议且继续发放工资，视为双方同意以原条件继续履行合同，但公司未与张某续签书面劳动合同违法。判决公司支付2021年2月至2021年12月共11个月的双倍工资差额88,000元，以及终止劳动关系经济补偿36,000元（8,000元/月×4.5个月）。"
key_rules_applied: 
  - rule_id: "labor_rule_001"
    explanation: "合同期满后继续用工但未续签的，同样适用未签订劳动合同双倍工资罚则，最长计算11个月。"
  - rule_id: "labor_rule_024"
    explanation: "固定期限劳动合同期满终止，除用人单位维持或提高条件续签而劳动者不同意外，用人单位应当支付经济补偿。"
legal_principles: 
  - "固定期限劳动合同期满后劳动者继续工作的，用人单位应在1个月内续签书面合同"
  - "合同期满后未续签但继续用工超过1个月的，用人单位应支付双倍工资"
  - "合同期满终止且劳动者不要求续签的，用人单位应依法支付经济补偿"
relevance_score: 0.9
