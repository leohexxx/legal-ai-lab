case_id: "labor_case_015"
title: "钱某诉上海某外资企业违法辞退2N赔偿案"
domain: "labor"
related_categories:
  - "illegal_termination"
  - "severance_pay"
source: "参考：上海市第二中级人民法院（2023）沪02民终1234号"
publish_date: "2023-05-22"
summary: "钱某于2010年3月入职上海某外资企业担任高级工程师，月薪35,000元。2023年1月公司以'组织结构调整'为由单方解除劳动合同，但未与钱某协商变更岗位，也未提前30天通知或支付代通知金，更未事先通知工会。钱某认为公司违法解除，要求支付2N赔偿金。"
facts: 
  - "钱某于2010年3月1日入职上海某外资企业，工龄12年10个月，月薪35,000元"
  - "2023年1月10日公司向钱某发出解除通知，理由是'因公司组织结构调整，你的岗位被撤销'"
  - "公司未与钱某协商变更至其他岗位，直接解除劳动合同"
  - "公司未提前30日书面通知，也未支付代通知金（1个月工资）"
  - "公司解除前未事先将理由通知工会，且公司设有工会"
  - "钱某解除前12个月平均工资为36,000元（高于当地社平工资3倍，按3倍封顶）"
dispute_focus: "公司以组织结构调整为由直接解除劳动合同但未履行协商变更、提前通知和通知工会等程序，是否构成违法解除"
judgment: "法院认定：公司以组织结构调整为由解除劳动合同属于经济性裁员的法定情形，但公司未履行任何法定程序：（1）未与钱某协商变更劳动合同；（2）未提前30日通知或支付代通知金；（3）未事先通知工会。判决公司支付违法解除赔偿金2N共计504,000元（36,000元/月×7个月×2倍，其中工龄按12年折算社平3倍封顶）。"
key_rules_applied: 
  - rule_id: "labor_rule_006"
    explanation: "用人单位违反法定程序解除劳动合同（未协商变更、未通知工会）的，构成违法解除，应支付2倍经济补偿的赔偿金。"
  - rule_id: "labor_rule_030"
    explanation: "劳动者月工资高于当地上年度职工月平均工资3倍的，经济补偿标准按社平工资3倍计算，最高不超过12年。"
legal_principles: 
  - "因客观情况变化解除劳动合同的，必须先与劳动者协商变更，未能达成一致方可解除"
  - "解除劳动合同应当事先将理由通知工会，未通知的构成程序违法"
  - "违法解除劳动合同的赔偿金为经济补偿的2倍，即2N"
relevance_score: 0.95
