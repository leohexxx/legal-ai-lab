case_id: "labor_case_008"
title: "周某诉上海某金融科技公司年终奖发放争议案"
domain: "labor"
related_categories:
  - "bonus_commission"
source: "参考：上海市浦东新区人民法院（2023）沪0115民初12345号"
publish_date: "2023-07-15"
summary: "周某于2021年1月入职上海某金融科技公司，年薪40万元（月薪25,000元+年终奖10万元）。2022年12月公司以周某'绩效不达标'为由拒绝发放2022年度年终奖10万元。周某认为其年度绩效考核为B（良好），符合公司年终奖发放条件，遂申请仲裁要求公司支付年终奖。"
facts: 
  - "周某于2021年1月入职上海某金融科技公司，劳动合同约定年薪40万元，其中月薪25,000元，年终奖10万元"
  - "劳动合同和员工手册均规定：年度绩效考核为B及以上者全额发放年终奖"
  - "周某2022年度绩效考核结果为B（良好），但公司单方面以'绩效不达标'为由拒绝发放年终奖"
  - "公司未能提供任何证据证明周某绩效不达标，也未能说明B等为何属于不达标"
  - "2022年度公司其他获评B级的员工均全额收到了年终奖"
dispute_focus: "劳动合同明确约定年终奖且劳动者达到发放条件的情况下，用人单位能否单方拒绝发放"
judgment: "仲裁委认定：劳动合同明确约定了年终奖及发放条件，周某考核结果为B级，符合全额发放条件。公司对周某与同级别员工区别对待缺乏合理依据。裁决公司支付周某2022年度年终奖100,000元。公司不服诉讼，一审法院维持仲裁裁决。"
key_rules_applied: 
  - rule_id: "labor_rule_013"
    explanation: "劳动合同明确约定年终奖及发放条件的，用人单位应当按照约定履行。劳动者达到约定条件的，用人单位不得单方拒绝发放。"
  - rule_id: "rule_001"
    explanation: "工资包括计时工资、计件工资、奖金、津贴和补贴等。年终奖属于劳动报酬的组成部分，受法律保护。"
legal_principles: 
  - "年终奖属于劳动报酬的组成部分，受法律保护"
  - "劳动合同或规章制度明确约定年终奖发放条件的，用人单位应按约定执行"
  - "用人单位对相同绩效员工区别对待的，应当给出合理理由"
relevance_score: 0.88
