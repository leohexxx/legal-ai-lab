case_id: "labor_case_024"
title: "徐某诉上海某芯片技术公司竞业限制补偿金标准案"
domain: "labor"
related_categories:
  - "non_compete_compensation"
source: "参考：上海市第一中级人民法院（2023）沪01民终4567号"
publish_date: "2023-07-05"
summary: "徐某于2020年1月入职上海某芯片技术公司担任高级工程师，双方签订了竞业限制协议，约定离职后竞业限制期为2年，补偿金按离职前月工资的30%支付。2022年6月徐某因个人原因离职后履行了竞业限制义务，但公司仅按上海市最低工资标准2,590元/月支付补偿金，徐某认为过低，要求按法定标准补足。"
facts: 
  - "徐某于2020年1月入职上海某芯片技术公司担任高级工程师，月薪28,000元，入职时签订了竞业限制协议"
  - "协议约定：竞业限制期2年，限制范围为全国芯片行业，补偿金为离职前月工资的30%（即8,400元/月）"
  - "2022年6月徐某因个人原因辞职，公司要求徐某履行竞业限制义务"
  - "公司实际按上海市最低工资标准2,590元/月支付竞业限制补偿金，称'公司新政策统一按此标准'"
  - "徐某履行了竞业限制义务，6个月内未入职任何竞争企业，生活压力巨大"
dispute_focus: "竞业限制协议约定的补偿金标准能否被用人单位单方改变？法定最低补偿金标准是什么"
judgment: "法院认定：竞业限制协议系双方真实意思表示，约定的补偿金计算方式有效，公司不得单方变更。即使协议未明确约定或约定不明确，《劳动合同法》司法解释规定补偿金最低为劳动者离职前12个月平均工资的30%且不低于劳动合同履行地最低工资标准。徐某月薪28,000元，30%为8,400元，远高于上海最低工资2,590元。判决公司按8,400元/月标准补付徐某6个月的竞业限制补偿金差额（8,400-2,590）×6=34,860元。"
key_rules_applied: 
  - rule_id: "labor_rule_044"
    explanation: "竞业限制补偿金的最低标准为劳动者离职前12个月平均月工资的30%，且不低于劳动合同履行地的最低工资标准。协议有约定的按约定执行。"
  - rule_id: "labor_rule_045"
    explanation: "用人单位不得单方降低竞业限制补偿金标准。补偿金低于法定标准的，劳动者有权要求按法定标准支付。"
legal_principles: 
  - "竞业限制补偿金最低为离职前12个月平均工资的30%，且不低于当地最低工资标准"
  - "竞业限制协议约定明确的，用人单位不得以内部政策为由单方变更"
  - "劳动者履行了竞业限制义务的，有权要求用人单位按约定或法定标准支付补偿金"
relevance_score: 0.92
