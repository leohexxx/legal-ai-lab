case_id: "labor_case_011"
title: "黄某诉广州某劳务派遣公司同工同酬纠纷案"
domain: "labor"
related_categories:
  - "dispatch"
  - "salary_arrears"
source: "参考：广州市中级人民法院（2022）粤01民终3456号"
publish_date: "2022-07-22"
summary: "黄某于2020年3月通过广州某劳务派遣公司派遣至某大型国企担任行政助理。黄某发现其月薪5,000元，而用工单位直接招聘的合同制员工担任相同岗位月薪为8,000元，且享受五险一金和企业年金，黄某仅有五险。黄某要求用工单位实行同工同酬。"
facts: 
  - "黄某于2020年3月与广州某劳务派遣公司签订劳动合同，被派遣至某国企工作，合同期2年"
  - "黄某担任行政助理岗位，与用工单位直接招聘的合同制员工李某从事完全相同的日常工作"
  - "黄某月薪5,000元，无年终奖；李某月薪8,000元，年终奖30,000元"
  - "黄某仅有五险（养老、医疗、失业、工伤、生育）；李某除五险外还有住房公积金和企业年金"
  - "黄某多次向用工单位和劳务派遣公司提出同工同酬要求，均被以'用工方式不同'为由拒绝"
dispute_focus: "劳务派遣员工与用工单位直接招聘员工从事相同工作，是否应享受相同的工资福利待遇"
judgment: "法院认定：黄某与被派遣用工单位的合同制员工李某从事相同岗位工作，工作内容、工作量和工作强度无明显差异。依据《劳动合同法》第六十三条，劳务派遣员工享有与用工单位同岗位劳动者同工同酬的权利。判决用工单位向黄某补足工资差额每月3,000元（自2020年3月起至2022年3月共24个月，合计72,000元），并按同岗位标准发放年终奖。"
key_rules_applied: 
  - rule_id: "labor_rule_028"
    explanation: "用工单位应当对被派遣劳动者与本单位同岗位劳动者实行相同的劳动报酬分配办法，不得因用工形式不同而区别对待。"
  - rule_id: "rule_001"
    explanation: "同工同酬是劳动报酬支付的基本原则，适用于所有劳动关系形态，包括劳务派遣。"
legal_principles: 
  - "劳务派遣员工享有与用工单位同岗位劳动者同工同酬的权利"
  - "用工单位不得因用工形式（派遣vs直接聘用）不同而实行差异化的薪酬福利待遇"
  - "同工同酬包括工资、奖金、津贴、补贴、社会保险等全部劳动报酬"
relevance_score: 0.91
