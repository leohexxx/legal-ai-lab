case_id: "labor_case_029"
title: "黄某诉福州某建筑公司劳动仲裁时效起算点争议案"
domain: "labor"
related_categories:
  - "arbitration_period"
source: "参考：福建省高级人民法院（2022）闽民再34号"
publish_date: "2022-11-30"
summary: "黄某于2015年3月至2021年12月在福州某建筑公司工作，公司一直未为其缴纳社会保险。2022年3月黄某申请劳动仲裁要求公司补缴社保，公司以'仲裁时效已过'为由抗辩，主张社保争议仲裁时效为1年，黄某的请求已超过时效。双方就仲裁时效的起算点产生重大争议。"
facts: 
  - "黄某于2015年3月10日入职福州某建筑公司，月薪9,000元，公司从未为其缴纳社保"
  - "黄某在职期间多次要求公司缴纳社保，公司均以'工程款未到账'为由推脱"
  - "2021年12月黄某因公司长期拖欠社保而辞职"
  - "2022年3月黄某向劳动仲裁委申请仲裁，要求公司补缴2015年3月至2021年12月期间的社保"
  - "公司主张：黄某的社保争议仲裁时效为1年，应从黄某知道或应当知道权利受侵害之日起算，黄某入职后第2个月就应知道未缴社保，时效早已届满"
dispute_focus: "要求用人单位补缴社会保险的仲裁时效应当从何时起算？是入职时、劳动关系终止时还是其他时间点"
judgment: "法院经再审认定：社会保险缴费争议属于持续性争议，用人单位每月都有为劳动者缴纳社保的法定义务，每月的未缴费行为都是新的侵害行为。但黄某在职期间长期知道未缴社保而未申请仲裁，对超出1年时效部分的权利不予支持。最终判决：仲裁时效应从每个月的工资发放日起分别计算1年，对于黄某申请仲裁前1年（2021年3月至2022年3月）内的社保请求予以支持，对于在此之前的请求因超过仲裁时效不予支持。同时，法院建议黄某通过劳动监察途径要求公司补缴。"
key_rules_applied: 
  - rule_id: "labor_rule_055"
    explanation: "劳动争议仲裁时效为1年，从知道或应当知道权利被侵害之日起计算。社保缴费属于持续性履行义务，每月未缴费构成新的侵害。"
  - rule_id: "rule_009"
    explanation: "欠薪等相关争议虽然适用1年仲裁时效，但劳动关系存续期间因拖欠劳动报酬发生争议的，劳动者申请仲裁不受1年仲裁时效限制，但劳动关系终止的应自终止之日起1年内提出。"
legal_principles: 
  - "劳动争议仲裁时效一般为1年，从知道或应当知道权利被侵害之日起计算"
  - "社保缴费属于持续性义务，每月的未缴费行为单独计算时效"
  - "劳动关系存续期间的欠薪争议不受1年仲裁时效限制，但社保争议存在争议"
relevance_score: 0.88
