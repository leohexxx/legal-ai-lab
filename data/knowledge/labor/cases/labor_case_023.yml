case_id: "labor_case_023"
title: "���某诉广州某外贸公司产假工资与生育津贴差额案"
domain: "labor"
related_categories:
  - "maternity_paternity_leave"
  - "salary_arrears"
source: "参考：广州市中级人民法院（2022）粤01民终7890号"
publish_date: "2022-08-08"
summary: "范某于2018年4月入职广州某外贸公司，月薪16,000元。2021年6月范某开始休产假，公司仅按广州市最低工资标准2,100元/月支付产假工资���导致范某产假期间的生育津贴与产假工资之间存在巨大差额。范某要求公司按正常工资标准补足差额。"
facts: 
  - "范某于2018年4月1日入职广州某外贸公司，月薪16,000元"
  - "2021年6月1日范某开始休产假，产假期为98天+80天奖励假共178天"
  - "公司为范某缴纳了生育保险，社保基金核发的生育津贴为21,000元（按公司平均缴费基数计算）"
  - "公司仅按广州市最低工资标准2,100元/月支付产假工资，合计仅支付约12,460元"
  - "范某实际月薪16,000元，产假178天应得工资约为94,933元（16,000÷30×178）"
  - "公司主张生育津贴已包含产假工资，公司无需再额外支付"
dispute_focus: "产假期间，生育津贴低于劳动者实际工资的，用人单位是否需要补足差额"
judgment: "法院认定：根据《女职工劳动保护特别规定》第八条，女职工产假期间的生育津贴，对已经参加生育保险的，按照用人单位上年度职工月平均工资的标准由生育保险基金支付。生育津贴低于女职工产假前工资标准的，用人单位应当补足差额。范某月薪16,000元高于公司平均缴费基数，公司应当补足产假工资与生育津贴的差额。判决公司支付产假工资差额共计73,473元（94,933元-21,000元-12,460元已支付部分）。"
key_rules_applied: 
  - rule_id: "labor_rule_041"
    explanation: "女职工产假期间的生育津贴低于本人工资标准的，差额部分由用人单位补足。用人单位不得仅按最低工资标准支付产假工资。"
  - rule_id: "labor_rule_040"
    explanation: "女职工生育享受98天产假，各地可依法延长。广州奖励假80天期间工资由用人单位按正常工资标准支付。"
legal_principles: 
  - "生育津贴低于劳动者实际工资的，用人单位应当补足差额"
  - "用人单位不得以社保已支付生育津贴为由免除补足差额的义务"
  - "各地奖励假期间的工资由用人单位按正常工资标准支付"
