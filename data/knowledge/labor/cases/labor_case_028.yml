case_id: "labor_case_028"
title: "李某等45名工人诉东莞某电子厂群体性欠薪集体仲裁案"
domain: "labor"
related_categories:
  - "mass_arrears"
  - "salary_arrears"
source: "参考：东莞市劳动人事争议仲裁院（2023）东劳人仲案字第456号"
publish_date: "2023-07-28"
summary: "东莞某电子厂因经营不善实际控制人跑路，拖欠李某等45名工人5个月工资共计218万元。工人推选5名代表申请劳动仲裁，同时申请财产保全查封工厂机器设备。仲裁委开辟绿色通道快速审理，裁决公司支付全部欠薪。因公司资产不足以支付，工人通过申请工资优先受偿权参与分配。"
facts: 
  - "东莞某电子厂共有员工45人，因经营不善实际控制人刘某于2023年2月失联"
  - "公司拖欠45名工人2022年10月至2023年2月共5个月工资，总额2,183,600元"
  - "工人推选李某等5名代表申请劳动仲裁，要求公司支付全部欠薪"
  - "工人同时向法院申请财产保全，查封了工厂剩余机器设备和原材料（估值约150万元）"
  - "公司已停产，无其他资产可供执行，且已拖欠厂房租金3个月"
  - "45名工人中包括3名孕期女职工和2名工伤人员"
dispute_focus: "群体性欠薪案件中，劳动者如何通过集体仲裁维权？工资优先受偿权如何实现"
judgment: "仲裁委经审理认为：公司拖欠45名工人工资事实清楚、证据充分，依据《劳动合同法》第八十五条等规定，裁决公司在裁决生效后3日内一次性支付全部欠薪2,183,600元。因公司实际控制人失联、公司停产，仲裁委出具仲裁裁决书后，工人凭裁决书向法院申请强制执行。法院依法拍卖查封的机器设备，所得款项优先清偿工人工资（工资优先于普通债权）。因拍卖款不足，45名工人按比例分配了剩余资产。劳动监察部门同时对实际控制人刘某进行追逃。"
key_rules_applied: 
  - rule_id: "labor_rule_052"
    explanation: "同一劳动争议涉及多名劳动者的，可以推选代表参加仲裁和诉讼。欠薪事实清楚的，仲裁委应当快速审理。"
  - rule_id: "labor_rule_053"
    explanation: "企业破产或资产不足以清偿全部债务时，劳动者工资具有优先受偿权，优先于普通债权和担保物权。"
legal_principles: 
  - "群体性劳动争议可以推选代表参加仲裁和诉讼活动"
  - "欠薪案件农民工可申请财产保全，防止资产转移"
  - "劳动者工资在企业破产或资产清算中享有优先受偿权"
relevance_score: 0.93
