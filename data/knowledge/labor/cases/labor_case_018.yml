case_id: "labor_case_018"
title: "冯某诉天津某贸易公司离职证明开具纠纷案"
domain: "labor"
related_categories:
  - "resignation_certificate"
source: "参考：天津市南开区人民法院（2022）津0104民初4567号"
publish_date: "2022-12-20"
summary: "冯某于2020年6月入职天津某贸易公司，2022年8月冯某因个人原因辞职，双方解除劳动关系。冯某多次要求公司为其开具离职证明和办理社保关系转移手续，公司以'冯某在职期间曾发生工作失误造成公司损失尚未解决'为由拒绝。冯某因此无法入职新公司，要求公司赔偿损失。"
facts: 
  - "冯某于2020年6月入职天津某贸易公司，月薪7,000元"
  - "2022年8月15日冯某因个人原因提前30天书面辞职，公司同意，2022年9月15日办理离职"
  - "冯某多次要求公司出具离职证明并办理社保和档案转移手续"
  - "公司以'冯某在职期间曾因疏忽导致客户投诉，造成公司潜在损失约5万元尚未解决'为由拒绝"
  - "冯某因此无法入职已收到录用通知的新公司（月薪8,500元），新公司因无离职证明取消录用"
  - "冯某失业3个月后才重新找到工作"
dispute_focus: "用人单位以劳动者在职期间存在工作失误为由拒绝开具离职证明，是否合法"
judgment: "法院认定：根据《劳动合同法》第五十条，用人单位在解除或终止劳动合同时有义务出具解除证明并办理档案和社保转移手续，该义务是法定的、无条件的。公司与冯某之间的潜在损失争议属于另一法律关系，可通过协商或诉讼解决，不能成为拒绝出具离职证明的理由。判决公司为冯某出具离职证明并办理社保转移手续，并赔偿冯某因无法入职新公司造成的工资损失25,500元（8,500元/月×3个月）。"
key_rules_applied: 
  - rule_id: "labor_rule_009"
    explanation: "用人单位应当在解除或终止劳动合同时出具解除或终止证明，并在15日内为劳动者办理档案和社保关系转移手续，该义务不附带任何条件。"
  - rule_id: "rule_018"
    explanation: "劳动者依法解除劳动合同的，用人单位应当为其办理工作交接、出具证明并办理相关手续。用人单位不得以任何理由拒绝或拖延。"
legal_principles: 
  - "用人单位出具离职证明是法定的、无条件的义务，不得附加任何条件"
  - "用人单位与劳动者之间的其他争议不应影响离职证明的开具"
  - "用人单位拒绝出具离职证明给劳动者造成损失的，应当承担赔偿责任"
relevance_score: 0.88
