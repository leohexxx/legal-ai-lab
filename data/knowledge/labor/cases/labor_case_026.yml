case_id: "labor_case_026"
title: "叶某诉深圳某科技公司孕期降薪辞退案"
domain: "labor"
related_categories:
  - "pregnancy_protection"
  - "illegal_termination"
source: "参考：深圳市中级人民法院（2023）粤03民终7890号"
publish_date: "2023-06-12"
summary: "叶某于2020年9月入职深圳某科技公司任市场经理，月薪20,000元。2022年8月叶某确诊怀孕并告知公司，公司当月即下发调岗通知书，将叶某调至行政助理岗位，月薪降至12,000元。叶某拒绝接受后，公司以'不服从工作安排'为由解除劳动合同。叶某申请仲裁要求撤销解除决定、恢复原岗位并补足工资差额。"
facts: 
  - "叶某于2020年9月入职深圳某科技公司，月薪20,000元，担任市场经理"
  - "2022年8月10日叶某向公司提交怀孕证明（已怀孕8周）"
  - "2022年8月20日公司向叶某发出《岗位调整通知书》，调至行政助理岗，月薪降至12,000元"
  - "叶某书面拒绝调岗，认为调整不合理且恶意降低待遇"
  - "2022年9月5日公司以'不服从工作安排、严重违反公司规章制度'为由解除劳动合同"
  - "公司无证据证明叶某不能胜任原岗位工作，也未证明调岗的必要性"
dispute_focus: "女职工怀孕后用人单位单方调岗降薪，劳动者拒绝后以不服从管理为由解除劳动合同，是否构成违法解除"
judgment: "法院认定：《女职工劳动保护特别规定》和《妇女权益保障法》明确规定，用人单位不得因女职工怀孕而降低其工资、予以辞退或单方变更其劳动合同。公司在叶某告知怀孕后立即调岗降薪，缺乏合理性和必要性，实质上是因怀孕而进行的歧视性处理。叶某拒绝调岗是维护自身合法权益，不构成违纪。判决撤销公司解除决定，恢复叶某劳动关系，按原岗位和市场经理薪资标准补发解除期间的工资损失。"
key_rules_applied: 
  - rule_id: "labor_rule_046"
    explanation: "用人单位不得因女职工怀孕、生育、哺乳而降低其工资、予以辞退或单方变更劳动合同。因怀孕调岗降薪属于就业歧视，依法无效。"
  - rule_id: "labor_rule_047"
    explanation: "孕期女职工不能适应原工作的，用人单位应根据医疗证明予以减轻劳动量或安排其他工作，但不得降低工资待遇。"
legal_principles: 
  - "用人单位不得因女职工怀孕而降低其工资待遇或变更劳动合同内容"
  - "因女职工怀孕而调岗降薪的，调岗行为无效，应按原待遇执行"
  - "劳动者拒绝违法调岗不构成不服从工作安排，用人单位不得以此为由解除劳动合同"
relevance_score: 0.94
